<!DOCTYPE html>
<html lang="ms">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- QRious untuk QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563AB', navy: { 800: '#1e293b', 900: '#0f172a' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #2563AB; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .nav-item { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.08); border-left-color: #3b82f6; color: white; font-weight: 600; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .chart-container { position: relative; height: 250px; width: 100%; }
    </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">
    <div id="app" class="w-full h-full flex"></div>
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // PENTING: GANTIKAN DENGAN KUNCI SUPABASE ANDA SEBELUM DIJALANKAN
        const SUPABASE_URL = "https://lohbpqkldrdagkbhbxka.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_o3vJ1G77WzvSkei-hS7dNg_oTJepoIA";

        let supabaseClient;
        let statusChartInstance = null; 

        const STATE = {
            user: null,
            profile: null,
            view: 'dashboard',
            loading: true,
            modal: null,
            sidebarOpen: false,
            data: {
                assets: [], locations: [], categories: [], personnel: [],
                maintenance: [], damage: [], movements: [], inspections: [],
                disposals: [], audit_logs: [], user_profiles: []
            },
            filters: { search: '', status: '' }
        };

        const STATUS_OPTIONS = ["MASIH DIGUNAKAN", "ROSAK", "CADANG LUPUS", "DILUPUSKAN", "DIPINJAM", "DISELENGGARA"];

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-600' : (type === 'warning' ? 'bg-amber-500' : 'bg-green-600');
            toast.className = `${bg} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-4 opacity-0`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getBadgeColor(status) {
            switch((status || '').toUpperCase()) {
                case 'MASIH DIGUNAKAN': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'ROSAK': return 'bg-red-100 text-red-800 border-red-200';
                case 'CADANG LUPUS': return 'bg-orange-100 text-orange-800 border-orange-200';
                case 'DILUPUSKAN': return 'bg-slate-100 text-slate-600 border-slate-200';
                case 'DIPINJAM': return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'DISELENGGARA': return 'bg-purple-100 text-purple-800 border-purple-200';
                case 'SELESAI': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'BAIK': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'AKTIF': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                default: return 'bg-gray-100 text-gray-800 border-gray-200';
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function isAdmin() { return STATE.profile && STATE.profile.role === 'ADMIN'; }
        
        function checkAdminAction() {
            if (!isAdmin()) { showToast("Akses Ditolak: Memerlukan peranan Admin.", "error"); return false; }
            return true;
        }

        function getEntityName(collection, id) {
            if (!id) return '-';
            const item = STATE.data[collection]?.find(x => x.id === id);
            return item ? (item.nama || item.name || item.registration_no || id) : id;
        }

        async function initApp() {
            if (!SUPABASE_URL || SUPABASE_URL.includes("MASUKKAN_URL")) {
                document.getElementById('app').innerHTML = `
                    <div class="w-full h-full flex items-center justify-center bg-slate-900 text-white p-6">
                        <div class="max-w-md text-center bg-slate-800 p-8 rounded-xl shadow-2xl border border-red-500">
                            <h2 class="text-2xl font-bold text-red-400 mb-4">Sistem Belum Disambungkan</h2>
                            <p class="text-slate-300">Sila masukkan <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> yang sah di dalam fail HTML.</p>
                        </div>
                    </div>`;
                return;
            }

            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    STATE.user = session.user;
                    await fetchUserProfile();
                    await fetchAllData();
                    STATE.loading = false;
                    renderApp();
                } else {
                    STATE.user = null; STATE.profile = null; STATE.loading = false;
                    renderApp();
                }
            });
        }

        async function fetchUserProfile() {
            try {
                const { data } = await supabaseClient.from('user_profiles').select('*').eq('id', STATE.user.id).single();
                STATE.profile = data || { role: 'USER', email: STATE.user.email, name: STATE.user.email.split('@')[0] };
            } catch (e) { STATE.profile = { role: 'USER', email: STATE.user.email }; }
        }

        async function fetchAllData() {
            try {
                const tables = ['assets', 'movements', 'maintenance', 'damage', 'disposals', 'inspections', 'locations', 'categories', 'personnel'];
                const promises = tables.map(t => supabaseClient.from(t).select('*').order('created_at', { ascending: false }).catch(() => ({data:[]})));
                const results = await Promise.all(promises);

                tables.forEach((table, index) => { if (results[index] && results[index].data) STATE.data[table] = results[index].data; });

                if (isAdmin()) {
                    const { data: audits } = await supabaseClient.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(100);
                    if (audits) STATE.data.audit_logs = audits;
                    
                    const { data: users } = await supabaseClient.from('user_profiles').select('*').order('created_at', { ascending: false });
                    if (users) STATE.data.user_profiles = users;
                }
            } catch (e) { showToast("Ralat memuat turun beberapa data. Struktur jadual mungkin tidak lengkap.", "warning"); console.error(e); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<div class="loader mx-auto border-white"></div>`; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                const errDiv = document.getElementById('loginError');
                errDiv.classList.remove('hidden'); errDiv.innerText = error.message;
                btn.innerHTML = `Log Masuk`; btn.disabled = false;
            } else { showToast("Log masuk berjaya."); }
        }

        function renderApp() {
            const root = document.getElementById('app');

            if (STATE.loading) {
                root.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center bg-slate-50"><div class="loader mb-4"></div><p class="text-slate-500 font-medium">Menyambung ke Pangkalan Data...</p></div>`;
                return;
            }

            if (!STATE.user) {
                root.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center bg-slate-900" style="background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px;">
                        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                            <div class="bg-primary px-8 py-6 text-white text-center">
                                <h1 class="text-2xl font-bold tracking-tight">Aset Alih Biokimia</h1>
                                <p class="text-blue-100 text-sm mt-1">Institut Penyelidikan Veterinar (VRI)</p>
                            </div>
                            <div class="p-8">
                                <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                                    <div id="loginError" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 text-center font-medium"></div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">E-mel Kakitangan</label>
                                        <input type="email" id="email" required class="w-full px-4 py-2.5 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:bg-white outline-none transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kata Laluan</label>
                                        <input type="password" id="password" required class="w-full px-4 py-2.5 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:bg-white outline-none transition-all">
                                    </div>
                                    <button type="submit" id="loginBtn" class="mt-4 w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors">Log Masuk</button>
                                </form>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            root.innerHTML = `
                <!-- Sidebar -->
                <aside class="${STATE.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} fixed lg:relative z-40 w-64 h-full bg-navy-900 text-slate-300 flex flex-col transition-transform duration-300 lg:translate-x-0 shadow-xl">
                    <div class="p-5 border-b border-white/10 flex items-center justify-between">
                        <div>
                            <h2 class="text-white font-bold text-lg leading-tight">Biokimia VRI</h2>
                            <p class="text-[10px] text-blue-400 uppercase tracking-wider font-semibold">Pengurusan Aset Pintar</p>
                        </div>
                        <button onclick="STATE.sidebarOpen=false; renderApp()" class="lg:hidden text-slate-400 hover:text-white">&times;</button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-0.5 custom-scrollbar">
                        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-1 px-5">Utama</div>
                        ${navLink('dashboard', 'Papan Pemuka', 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6')}
                        ${navLink('assets', 'Senarai Aset Penuh', 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4')}
                        
                        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-4 px-5">Kitaran Hayat</div>
                        ${navLink('movements', 'Pergerakan & Pinjaman', 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4')}
                        ${navLink('maintenance', 'Penyelenggaraan (PM)', 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z')}
                        ${navLink('damage', 'Laporan Kerosakan', 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z')}
                        ${navLink('inspections', 'Pemeriksaan Berkala', 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4')}
                        ${navLink('disposals', 'Pelupusan (PEP)', 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16')}
                        
                        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-4 px-5">Data Induk & Laporan</div>
                        ${navLink('locations', 'Lokasi Penempatan', 'M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z')}
                        ${navLink('categories', 'Kategori Aset', 'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z')}
                        ${navLink('personnel', 'Pemegang (PIC)', 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z')}
                        ${navLink('reports', 'Jana Laporan CSV', 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z')}

                        ${isAdmin() ? `
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-4 px-5">Sistem Admin</div>
                            ${navLink('users', 'Pengurusan Pengguna', 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z')}
                            ${navLink('audit_trail', 'Jejak Audit Sistem', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z')}
                        ` : ''}
                    </div>

                    <div class="p-4 bg-navy-800 border-t border-white/10 shrink-0">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm">
                                ${(STATE.profile?.name || STATE.user.email).substring(0,2).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-white truncate">${escapeHTML(STATE.profile?.name || STATE.user.email)}</p>
                                <p class="text-[10px] text-blue-300 font-bold tracking-wider">${STATE.profile?.role || 'USER'}</p>
                            </div>
                        </div>
                        <button onclick="supabaseClient.auth.signOut()" class="w-full bg-white/10 hover:bg-red-500/80 text-white text-xs font-bold py-2 rounded transition-colors flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> Log Keluar
                        </button>
                    </div>
                </aside>

                <!-- Overlay Mobile -->
                <div onclick="STATE.sidebarOpen=false; renderApp()" class="fixed inset-0 bg-slate-900/60 z-30 lg:hidden ${STATE.sidebarOpen ? 'block' : 'hidden'}"></div>

                <!-- Main Content -->
                <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">
                    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center gap-4 shadow-sm z-10 shrink-0">
                        <button onclick="STATE.sidebarOpen=true; renderApp()" class="lg:hidden text-slate-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                        <h1 class="text-lg font-bold text-slate-800">${getViewTitle()}</h1>
                        <div class="ml-auto flex items-center gap-2">
                            <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full border border-emerald-100">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Pangkalan Data Terhubung
                            </span>
                        </div>
                    </header>
                    
                    <div class="flex-1 overflow-y-auto p-4 sm:p-6 custom-scrollbar">
                        <div class="max-w-7xl mx-auto space-y-6">
                            ${renderCurrentView()}
                        </div>
                    </div>
                </main>
                ${STATE.modal ? renderModal() : ''}
            `;

            if (STATE.view === 'dashboard') initCharts();
            if (STATE.modal?.type === 'assetProfile') generateQRCode();
        }

        function navLink(key, label, svgPath) {
            const isActive = STATE.view === key;
            return `
                <button onclick="STATE.view='${key}'; STATE.sidebarOpen=false; renderApp()" class="nav-item ${isActive ? 'active' : ''} w-full flex items-center gap-3 px-5 py-2.5 text-sm text-left">
                    <svg class="w-4 h-4 opacity-70 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${svgPath}"></path></svg>
                    <span class="truncate">${label}</span>
                </button>`;
        }

        function getViewTitle() {
            const t = { dashboard: 'Papan Pemuka', assets: 'Senarai Aset Penuh', movements: 'Pergerakan & Pinjaman', maintenance: 'Penyelenggaraan Aset', damage: 'Laporan Kerosakan', inspections: 'Pemeriksaan Berkala', disposals: 'Pelupusan Aset', locations: 'Lokasi Penempatan', categories: 'Kategori Aset', personnel: 'Pemegang Aset (PIC)', reports: 'Pusat Laporan & Eksport CSV', users: 'Pengurusan Pengguna', audit_trail: 'Jejak Audit Pangkalan Data' };
            return t[STATE.view] || 'Sistem Aset';
        }

        function renderCurrentView() {
            switch(STATE.view) {
                case 'dashboard': return renderDashboard();
                case 'assets': return renderAssets();
                case 'locations': return renderSimpleTable('locations', 'Lokasi Penempatan', ['name', 'code']);
                case 'categories': return renderSimpleTable('categories', 'Kategori Aset', ['name']);
                case 'personnel': return renderSimpleTable('personnel', 'Pemegang Aset', ['name', 'position', 'department']);
                case 'reports': return renderReports();
                case 'users': return renderUsers();
                case 'audit_trail': return renderAuditTrail();
                
                case 'movements': return renderTransactionTable({ 
                    title: 'Pergerakan & Pinjaman', collection: 'movements', formModal: 'movementForm', 
                    columns: [ 
                        { header: 'Aset Terlibat', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, 
                        { header: 'Tujuan', render: r => escapeHTML(r.purpose) }, 
                        { header: 'Lokasi Baru', render: r => escapeHTML(r.new_location) }, 
                        { header: 'Tarikh Keluar', render: r => formatDate(r.out_date) }, 
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } 
                    ] 
                });
                case 'maintenance': return renderTransactionTable({ 
                    title: 'Rekod Penyelenggaraan', collection: 'maintenance', formModal: 'maintenanceForm', 
                    columns: [ 
                        { header: 'Aset Terlibat', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, 
                        { header: 'Jenis Selenggara', render: r => escapeHTML(r.type) },
                        { header: 'Tarikh Mula', render: r => formatDate(r.start_date) }, 
                        { header: 'Kos (RM)', render: r => parseFloat(r.cost||0).toFixed(2) }, 
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } 
                    ] 
                });
                case 'damage': return renderTransactionTable({ 
                    title: 'Laporan Kerosakan', collection: 'damage', formModal: 'damageForm', 
                    columns: [ 
                        { header: 'Aset Terlibat', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, 
                        { header: 'Kerosakan', render: r => escapeHTML(r.damage_type) }, 
                        { header: 'Tarikh Lapor', render: r => formatDate(r.report_date) }, 
                        { header: 'Keutamaan', render: r => escapeHTML(r.priority) }, 
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } 
                    ] 
                });
                case 'inspections': return renderTransactionTable({ 
                    title: 'Pemeriksaan Berkala', collection: 'inspections', formModal: 'inspectionForm', 
                    columns: [

                                    <p class="font-semibold text-sm text-slate-700">${r.name}</p>

                                <button onclick="downloadCSV('${r.id}')" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 px-4 rounded font-medium transition-colors">Muat Turun</button>

        function downloadCSV(collection) {
            const data = STATE.data[collection];
            if (!data || data.length === 0) { showToast("Tiada data untuk dieksport.", "warning"); return; }
            
            const keys = Object.keys(data[0]).filter(k => k !== 'id' && !k.endsWith('_id')); // Hide internal IDs slightly for clean export
            let csv = keys.join(',') + '\n';
            
            data.forEach(row => {
                csv += keys.map(k => {
                    let val = row[k] === null ? '' : String(row[k]);
                    val = val.replace(/"/g, '""'); // escape quotes
                    return `"${val}"`;
                }).join(',') + '\n';
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Laporan_${collection}_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Laporan CSV berjaya dimuat turun.");
        }

        async function saveAssetForm(e, id) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            const btn = document.getElementById('saveAssetBtn');
            btn.innerHTML = `<div class="loader w-4 h-4 border-2 mx-auto"></div>`; btn.disabled = true;

            const payload = {
                name: document.getElementById('a_name').value.trim(),
                registration_no: document.getElementById('a_reg').value.trim(),
                status: document.getElementById('a_status').value,
                category: document.getElementById('a_cat').value,
                location: document.getElementById('a_loc').value,
                notes: document.getElementById('a_notes').value.trim()
            };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('assets').update(payload).eq('id', id);
                    if (error) throw error;
                    showToast("Maklumat aset berjaya dikemaskini.");
                } else {
                    const { error } = await supabaseClient.from('assets').insert([payload]);
                    if (error) throw error;
                    showToast("Aset baharu berjaya didaftarkan.");
                }
                await fetchAllData();
                STATE.modal = null; renderApp();
            } catch (err) {
                showToast(err.message, "error");
                btn.innerHTML = `Simpan Rekod Aset`; btn.disabled = false;
            }
        }

        async function saveTransaction(e, table) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            const btn = document.getElementById('saveTransBtn');
            btn.innerHTML = `<div class="loader w-4 h-4 border-2 mx-auto"></div>`; btn.disabled = true;

            let payload = { asset_id: document.getElementById('t_asset_id').value };
            
            if(table === 'movements') {
                payload.new_location = document.getElementById('t_new_location').value;
                payload.out_date = document.getElementById('t_out_date').value || null;
                payload.purpose = document.getElementById('t_purpose').value;
                payload.status = document.getElementById('t_status').value;
            } else if (table === 'maintenance') {
                payload.type = document.getElementById('t_type').value;
                payload.start_date = document.getElementById('t_start_date').value || null;
                payload.cost = parseFloat(document.getElementById('t_cost').value) || 0;
                payload.status = document.getElementById('t_status').value;
            } else if (table === 'damage') {
                payload.damage_type = document.getElementById('t_damage_type').value;
                payload.report_date = document.getElementById('t_report_date').value || null;
                payload.priority = document.getElementById('t_priority').value;
                payload.status = "Dilaporkan";
            } else if (table === 'inspections') {
                payload.condition = document.getElementById('t_condition').value;
                payload.inspection_date = document.getElementById('t_inspection_date').value || null;
                payload.notes = document.getElementById('t_notes').value;
                payload.inspector_name = STATE.profile?.name || STATE.user.email;
                payload.status = "Selesai Direkod";
            } else if (table === 'disposals') {
                payload.reason = document.getElementById('t_reason').value;
                payload.proposal_date = document.getElementById('t_proposal_date').value || null;
                payload.method = document.getElementById('t_method').value;
                payload.status = "Cadangan";
            }

            try {
                const { error } = await supabaseClient.from(table).insert([payload]);
                if (error) throw error;

                // Auto-update asset last_inspection_date if it's an inspection
                if (table === 'inspections') {
                    await supabaseClient.from('assets').update({ last_inspection_date: payload.inspection_date }).eq('id', payload.asset_id);
                }

                showToast("Rekod transaksi berjaya disimpan.");
                await fetchAllData();
                STATE.modal = null; renderApp();
            } catch (err) {
                showToast(err.message, "error");
                btn.innerText = `Cuba Semula`; btn.disabled = false;
            }
        }

        function modalUserForm() {
            return `
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg mb-6 text-sm text-blue-800">
                    <p class="font-bold mb-1">Maklumat Penting Pengesahan Pelayan</p>
                    <p>Borang ini berhubung terus dengan fungsi <b>RPC (Remote Procedure Call)</b> dalam pangkalan data PostgreSQL Supabase untuk memintas (bypass) pengesahan e-mel. Pastikan skrip SQL \`admin_create_user\` telah dijalankan terlebih dahulu.</p>
                </div>
                <form onsubmit="saveUserForm(event)" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="sm:col-span-2"><label class="block text-sm font-semibold text-slate-700 mb-1.5">Nama Penuh Staf <span class="text-red-500">*</span></label><input type="text" id="u_name" required class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none"></div>
                        <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">E-mel Rasmi (ID Log Masuk) <span class="text-red-500">*</span></label><input type="email" id="u_email" required class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none"></div>
                        <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Peranan Kuasa Sistem</label>
                            <select id="u_role" class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-primary outline-none">
                                <option value="USER">USER (Baca Sahaja & Laporan)</option><option value="ADMIN">ADMIN (Urus Data & Aset)</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2"><label class="block text-sm font-semibold text-slate-700 mb-1.5">Kata Laluan Permulaan <span class="text-red-500">*</span></label><input type="text" id="u_pass" required minlength="6" placeholder="Cth: AdminBiokimia123!" class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        <p class="text-xs text-slate-500 mt-1">Sila berikan kata laluan ini kepada pengguna secara peribadi. Minimum 6 aksara.</p></div>
                    </div>
                    <div class="pt-5 border-t border-slate-100 flex justify-end gap-3"><button type="submit" id="saveUserBtn" class="px-6 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-lg text-sm font-bold shadow-sm transition-colors">Daftarkan Pengguna</button></div>
                </form>
            `;
        }

        async function saveUserForm(e) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            
            const btn = document.getElementById('saveUserBtn');
            btn.innerHTML = `<div class="loader w-4 h-4 border-2 mx-auto"></div>`; btn.disabled = true;

            try {
                const { error } = await supabaseClient.rpc('admin_create_user', {
                    email: document.getElementById('u_email').value.trim().toLowerCase(),
                    password: document.getElementById('u_pass').value.trim(),
                    full_name: document.getElementById('u_name').value.trim(),
                    user_role: document.getElementById('u_role').value
                });

                if (error) throw error;
                showToast("Pengguna baharu telah didaftarkan dalam sistem dan sedia dilog masuk.");
                await fetchAllData();
                STATE.modal = null;
                renderApp();
            } catch (err) {
                showToast(err.message, "error");
                btn.innerHTML = `Daftarkan Pengguna`; btn.disabled = false;
            }
        }

        async function deleteRecord(collection, id) {
            if(!checkAdminAction()) return;
            const msg = collection === 'assets' ? "AMARAN: Anda pasti ingin menanda aset ini sebagai DILUPUSKAN secara kekal dari paparan utama?" : "Pasti ingin memadam rekod induk ini?";
            if(!confirm(msg)) return;
            
            try {
                if(collection === 'assets') {
                    // Soft Delete implementation as requested in requirements
                    const { error } = await supabaseClient.from('assets').update({ is_deleted: true, status: 'DILUPUSKAN' }).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from(collection).delete().eq('id', id);
                    if (error) throw error;
                }
                showToast("Tindakan berjaya. Rekod telah dipadamkan/dikemaskini.");
                await fetchAllData();
                STATE.modal = null; renderApp();
            } catch (err) { showToast(err.message, "error"); }
        }

        // Jalankan aplikasi semasa halaman dimuatkan
        initApp();
    </script>
</body>
</html>
