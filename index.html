        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#14294A', 900: '#0F1E36' },
                        primary: '#2563AB'

                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F4F6F9; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .nav-item { transition: all 0.2s ease-in-out; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255, 255, 255, 0.1); border-left: 4px solid #60A5FA; color: white; }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #2563AB; width: 24px; height: 24px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">
    <div id="app" class="w-full h-full flex"></div>
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // ============================================================================
        // KONFIGURASI SUPABASE (SILA TUKAR KUNCI DI BAWAH)
        // ============================================================================
        const SUPABASE_URL = "https://lohbpqkldrdagkbhbxka.supabase.co"; // Ganti URL anda
        const SUPABASE_ANON_KEY = "sb_publishable_o3vJ1G77WzvSkei-hS7dNg_oTJepoIA"; // Ganti Anon Key anda

        let supabaseClient;

        // Global State Management
        const STATE = {
            user: null,
            profile: null,
            view: 'dashboard',
            loading: true,
            modal: null,
            sidebarOpen: false,
            data: {
                assets: [], locations: [], categories: [], personnel: [],
                maintenance: [], damage: [], movements: [], inspections: [],
                disposals: [], audit_logs: []
            },
            filters: { search: '', status: '' }
        };

        const STATUS_OPTIONS = ["MASIH DIGUNAKAN", "ROSAK", "CADANG LUPUS", "DILUPUSKAN", "DIPINJAM", "DISELENGGARA"];

        // Tambah pembolehubah global ini untuk menyimpan rekod carta
        let statusChartInstance = null;

        // Utility Functions
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : (type === 'warning' ? 'bg-amber-500' : 'bg-green-600');
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-opacity duration-300 opacity-0`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            
            // Fade in
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            
            // Remove after 3.5s
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function formatCurrency(amount) {
            if(!amount) return 'RM 0.00';
            return 'RM ' + parseFloat(amount).toFixed(2);
        }

        function getBadgeColor(status) {
            switch((status || '').toUpperCase()) {
                case 'MASIH DIGUNAKAN': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'ROSAK': return 'bg-red-100 text-red-800 border-red-200';
                case 'CADANG LUPUS': return 'bg-orange-100 text-orange-800 border-orange-200';
                case 'DILUPUSKAN': return 'bg-slate-100 text-slate-600 border-slate-200';
                case 'DIPINJAM': return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'DISELENGGARA': return 'bg-purple-100 text-purple-800 border-purple-200';
                case 'SELESAI': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                default: return 'bg-gray-100 text-gray-800 border-gray-200';
            }
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function isAdmin() {
            return STATE.profile && STATE.profile.role === 'ADMIN';
        }

        function checkAdminAction() {
            if (!isAdmin()) {
                showToast("Akses Ditolak: Memerlukan peranan Admin.", "error");
                return false;
            }
            return true;
        }

        function getEntityName(collection, id, field = 'name') {
            if (!id) return '-';
            // Specific fallback for personnel
            if (collection === 'personnel') {
                const item = STATE.data.personnel.find(x => x.id === id);
                return item ? item.nama : id; // note: database might use 'nama' or 'name', standardizing to 'nama' in our tables
            }
            const item = STATE.data[collection].find(x => x.id === id);
            // Handle both 'nama' and 'name' properties safely
            return item ? (item.nama || item.name || id) : id; 
        }

        function generateID() {
            return 'A' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }

        // Initialization & Auth
        async function initApp() {
            if (!SUPABASE_URL || SUPABASE_URL.includes("MASUKKAN-ANON-KEY")) {
                document.getElementById('app').innerHTML = `
                    <div class="w-full h-full flex items-center justify-center bg-slate-900 text-white p-6">
                        <div class="max-w-md text-center">
                            <h2 class="text-2xl font-bold text-red-400 mb-4">Konfigurasi Tidak Lengkap</h2>
                            <p class="text-slate-300">Sila masukkan <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> di dalam fail index.html untuk menyambungkan aplikasi ini dengan pangkalan data anda.</p>
                        </div>
                    </div>`;
                return;
            }

            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    STATE.user = session.user;
                    await fetchUserProfile();
                    await fetchAllData();
                    STATE.loading = false;
                    renderApp();
                } else {
                    STATE.user = null;
                    STATE.profile = null;
                    STATE.loading = false;
                    renderApp();
                }
            });
        }

        async function fetchUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('user_profiles')
                    .select('*')
                    .eq('id', STATE.user.id)
                    .single();
                
                if (data) {
                    STATE.profile = data;
                } else {
                    // Fallback if profile doesn't exist yet
                    STATE.profile = { role: 'USER', email: STATE.user.email, name: STATE.user.email.split('@')[0] };
                }
            } catch (e) {
                console.error("Profile fetch error:", e);
                STATE.profile = { role: 'USER', email: STATE.user.email };
            }
        }

        async function fetchAllData() {
            try {
                const tables = ['assets', 'locations', 'categories', 'personnel', 'maintenance', 'damage', 'movements', 'disposals'];
                
                // Fetch in parallel
                const promises = tables.map(table => supabaseClient.from(table).select('*'));
                const results = await Promise.all(promises);

                tables.forEach((table, index) => {
                    if (results[index].data) {
                        STATE.data[table] = results[index].data;
                    }
                });

                // Fetch Audit logs if Admin
                if (isAdmin()) {
                    const { data } = await supabaseClient.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(50);
                    if (data) STATE.data.audit_logs = data;
                }

                // Temporary shim for inspections if table doesn't exist yet
                try {
                    const { data } = await supabaseClient.from('inspections').select('*');
                    if (data) STATE.data.inspections = data;
                } catch(e) { STATE.data.inspections = []; }

            } catch (e) {
                showToast("Terdapat ralat semasa memuat turun data.", "error");
                console.error(e);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            btn.innerHTML = `<div class="loader mx-auto border-white"></div>`;
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('loginError').classList.remove('hidden');
                document.getElementById('loginError').innerText = error.message;
                btn.innerHTML = `Log Masuk Sistem`;
                btn.disabled = false;
            } else {
                showToast("Log masuk berjaya.");
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
        }

        // ============================================================================
        // RENDER ENGINE (UI)
        // ============================================================================
        function renderApp() {
            const root = document.getElementById('app');

            if (STATE.loading) {
                root.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center bg-slate-50"><div class="loader mb-4"></div><p class="text-slate-500 font-medium">Memuatkan data dari Supabase...</p></div>`;
                return;
            }

            if (!STATE.user) {
                root.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center bg-slate-900 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                            <div class="bg-primary px-8 py-6 text-white text-center">
                                <h1 class="text-2xl font-bold tracking-tight mb-1">Aset Alih Biokimia</h1>
                                <p class="text-blue-100 text-sm">Institut Penyelidikan Veterinar (VRI)</p>
                            </div>
                            <div class="p-8">
                                <form onsubmit="handleLogin(event)" class="flex flex-col gap-5">
                                    <div id="loginError" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100"></div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1">E-mel Kakitangan</label>
                                        <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Laluan</label>
                                        <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                                    </div>
                                    <button type="submit" id="loginBtn" class="mt-2 w-full bg-primary hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition-colors">Log Masuk Sistem</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            root.innerHTML = `
                <!-- Sidebar -->
                <aside class="${STATE.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} transform lg:translate-x-0 transition-transform duration-300 fixed lg:relative z-40 w-64 h-full bg-navy-900 text-slate-300 flex flex-col shadow-xl">
                    <div class="p-5 border-b border-white/10 flex justify-between items-center">
                        <div>
                            <h2 class="text-white font-bold text-lg leading-tight">Biokimia VRI</h2>
                            <p class="text-xs text-blue-300">Pengurusan Aset Pintar</p>
                        </div>
                        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">&times;</button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1 custom-scrollbar">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-2 px-3">Utama</div>
                        ${navLink('dashboard', 'Papan Pemuka', 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6')}
                        ${navLink('assets', 'Senarai Aset Penuh', 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4')}
                        
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-6 px-3">Operasi Kitaran Hayat</div>
                        ${navLink('movements', 'Pergerakan & Pinjaman', 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4')}
                        ${navLink('maintenance', 'Penyelenggaraan (PM/CM)', 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z')}
                        ${navLink('damage', 'Laporan Kerosakan', 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z')}
                        ${navLink('inspections', 'Pemeriksaan Berkala', 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4')}
                        ${navLink('disposals', 'Pelupusan (PEP)', 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16')}
                        
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-6 px-3">Laporan & Tetapan</div>
                        ${navLink('reports', 'Jana Laporan & Eksport', 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z')}
                        
                        ${isAdmin() ? `
                            ${navLink('setup_master', 'Data Induk (Lokasi/Kategori)', 'M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4')}
                            ${navLink('audit_trail', 'Jejak Audit Sistem', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z')}
                        ` : ''}
                    </div>

                    <div class="p-4 border-t border-white/10 bg-navy-800">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-inner">
                                ${(STATE.profile?.name || STATE.user.email).substring(0,2).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-white truncate">${escapeHTML(STATE.profile?.name || STATE.user.email)}</p>
                                <p class="text-xs text-blue-400 mt-0.5"><span class="bg-blue-900 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${STATE.profile?.role || 'USER'}</span></p>
                            </div>
                        </div>
                        <button onclick="handleLogout()" class="mt-4 w-full bg-white/10 hover:bg-red-500/80 text-white text-sm font-medium py-2 rounded transition-colors flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Log Keluar
                        </button>
                    </div>
                </aside>

                <!-- Overlay for Mobile Sidebar -->
                <div onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-30 lg:hidden ${STATE.sidebarOpen ? 'block' : 'hidden'} backdrop-blur-sm"></div>

                <!-- Main Content Area -->
                <main class="flex-1 flex flex-col min-w-0 bg-slate-50 h-full overflow-hidden">
                    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
                        <div class="flex items-center gap-4">
                            <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-800">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            </button>
                            <h1 class="text-xl font-bold text-slate-800 tracking-tight">${getViewTitle()}</h1>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-full border border-emerald-200 shadow-sm">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Bersambung ke Supabase
                            </span>
                        </div>
                    </header>
                    
                    <div class="flex-1 overflow-y-auto p-4 sm:p-6 custom-scrollbar">
                        <div class="max-w-7xl mx-auto space-y-6">
                            ${renderCurrentView()}
                        </div>
                    </div>
                </main>

                <!-- Modal Container -->
                ${STATE.modal ? renderModal() : ''}
            `;

            // Post-render actions
            if (STATE.view === 'dashboard') initCharts();
            if (STATE.modal?.type === 'assetProfile') generateQRCode();
        }

        function navLink(key, label, svgPath) {
            const isActive = STATE.view === key;
            return `
                <button onclick="changeView('${key}')" class="nav-item ${isActive ? 'active' : ''} w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left">
                    <svg class="w-5 h-5 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${svgPath}"></path></svg>
                    <span class="font-medium">${label}</span>
                </button>
            `;
        }

        function toggleSidebar() {
            STATE.sidebarOpen = !STATE.sidebarOpen;
            renderApp();
        }

        function changeView(view) {
            STATE.view = view;
            STATE.sidebarOpen = false;
            renderApp();
        }

        function getViewTitle() {
            const titles = {
                'dashboard': 'Papan Pemuka Prestasi',
                'assets': 'Pangkalan Data Aset Menyeluruh',
                'movements': 'Rekod Pergerakan & Pinjaman',
                'maintenance': 'Rekod Penyelenggaraan (PM/CM)',
                'damage': 'Laporan Kerosakan & Aduan',
                'inspections': 'Pemeriksaan Aset Berkala',
                'disposals': 'Cadangan & Kelulusan Pelupusan',
                'reports': 'Eksport & Penjanaan Laporan',
                'setup_master': 'Pengurusan Data Induk',
                'audit_trail': 'Jejak Audit Pangkalan Data (Kebal)'
            };
            return titles[STATE.view] || 'Sistem Aset';
        }

        // ============================================================================
        // VIEWS
        // ============================================================================
        
        function renderDashboard() {
            const assets = STATE.data.assets || [];
            if (assets.length === 0) {
                return `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center">
                        <div class="w-16 h-16 bg-blue-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800 mb-2">Pangkalan Data Masih Kosong</h2>
                        <p class="text-slate-500 max-w-md mx-auto mb-6">Sila mula mendaftarkan aset melalui menu <b>Senarai Aset Penuh</b> atau lakukan migrasi data jika anda mempunyai fail CSV sedia ada.</p>
                        ${isAdmin() ? `<button onclick="changeView('assets')" class="bg-primary hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-sm transition-colors">Pergi ke Senarai Aset</button>` : ''}
                    </div>`;
            }

            const activeCount = assets.filter(a => a.status === 'MASIH DIGUNAKAN').length;
            const brokenCount = assets.filter(a => a.status?.includes('ROSAK')).length;
            const dipinjamCount = assets.filter(a => a.status === 'DIPINJAM').length;
            
            const recentDamage = (STATE.data.damage || []).slice(0, 4);

            return `
                <!-- Stats Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    ${statCard('Jumlah Aset', assets.length, 'bg-blue-50 text-blue-600', 'M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4')}
                    ${statCard('Aktif Digunakan', activeCount, 'bg-emerald-50 text-emerald-600', 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z')}
                    ${statCard('Sedang Dipinjam', dipinjamCount, 'bg-purple-50 text-purple-600', 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4')}
                    ${statCard('Rosak / Aduan', brokenCount, 'bg-red-50 text-red-600', 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z')}

                <!-- Charts & Lists -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">

                            <span class="w-1.5 h-4 bg-primary rounded-full"></span> Status Aset Keseluruhan

                            <canvas id="statusChart"></canvas>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col">
                        <div class="flex justify-between items-center mb-4">

                                <ul class="divide-y divide-slate-100">
                                    ${recentDamage.map(d => `
                                        <li class="py-3 flex items-start gap-3">
                                            <div class="mt-0.5 bg-red-50 text-red-500 p-1.5 rounded-md"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>

        function statCard(title, value, colorClasses, iconPath) {
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 transition-transform hover:-translate-y-1 duration-200">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 ${colorClasses}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}"></path></svg>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-slate-800 leading-tight">${value}</p>
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mt-0.5">${title}</p>
                    </div>
                </div>
            `;
        }

        function initCharts() {
            const ctx = document.getElementById('statusChart');
            if (!ctx) return;

            // Padam carta lama jika wujud untuk elak 'infinite loop' dan pertindihan
            if (statusChartInstance) {
                statusChartInstance.destroy();
            }

            // Kira jumlah setiap status dari data aset
            const statusCounts = {};
            (STATE.data.assets || []).forEach(a => {
                const s = a.status || 'TIDAK DIKETAHUI';
                statusCounts[s] = (statusCounts[s] || 0) + 1;
            });

            // Simpan carta baharu ke dalam pembolehubah global
            statusChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#10B981', '#EF4444', '#F59E0B', '#64748B', '#3B82F6', '#8B5CF6'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, font: { family: 'Inter', size: 11 } } }
                    }
                }
            });
        }

        function renderAssets() {
            let filtered = STATE.data.assets.filter(a => {
                const matchSearch = !STATE.filters.search || 
                                  (a.name?.toLowerCase().includes(STATE.filters.search.toLowerCase()) || 
                                   a.registration_no?.toLowerCase().includes(STATE.filters.search.toLowerCase()));
                const matchStatus = !STATE.filters.status || a.status === STATE.filters.status;
                return matchSearch && matchStatus;
            });

            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full">
                    <!-- Toolbar -->
                    <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-50/50 rounded-t-xl">
                        <div class="flex flex-1 w-full gap-2">
                            <div class="relative flex-1 max-w-sm">
                                <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <input type="text" id="searchAsset" placeholder="Cari nama atau no. siri..." value="${escapeHTML(STATE.filters.search)}" oninput="updateFilter('search', this.value)" class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow">
                            </div>
                            <select onchange="updateFilter('status', this.value)" class="py-2 px-3 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                                <option value="">Semua Status</option>
                                ${STATUS_OPTIONS.map(s => `<option value="${s}" ${STATE.filters.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                        ${isAdmin() ? `
                            <button onclick="openModal('assetForm')" class="w-full sm:w-auto bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition-colors flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                Daftar Aset Baru
                            </button>
                        ` : ''}
                    </div>

                    <!-- Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="p-4 pl-6">No. Siri / ID</th>
                                    <th class="p-4">Maklumat Aset</th>
                                    <th class="p-4">Lokasi & Kategori</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4 text-right pr-6">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filtered.length > 0 ? filtered.map(a => `
                                    <tr class="hover:bg-slate-50/70 transition-colors group">
                                        <td class="p-4 pl-6">
                                            <p class="text-sm font-mono font-medium text-slate-800">${escapeHTML(a.registration_no || a.id)}</p>
                                        </td>
                                        <td class="p-4">
                                            <p class="text-sm font-semibold text-slate-800 line-clamp-2">${escapeHTML(a.name)}</p>
                                            <p class="text-xs text-slate-500 mt-0.5 line-clamp-1">${escapeHTML(a.notes || 'Tiada catatan')}</p>
                                        </td>
                                        <td class="p-4">
                                            <p class="text-sm text-slate-700 font-medium">${escapeHTML(a.location || '-')}</p>
                                            <p class="text-xs text-slate-500 mt-0.5">${escapeHTML(a.category || '-')}</p>
                                        </td>
                                        <td class="p-4">
                                            <span class="px-2.5 py-1 text-[10px] font-bold rounded-full border ${getBadgeColor(a.status)} whitespace-nowrap">${escapeHTML(a.status)}</span>
                                        </td>
                                        <td class="p-4 pr-6 text-right">
                                            <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onclick="openModal('assetProfile', '${a.id}')" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-md" title="Profil Penuh"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></button>
                                                ${isAdmin() ? `<button onclick="openModal('assetForm', '${a.id}')" class="p-1.5 text-slate-600 hover:bg-slate-100 rounded-md" title="Kemaskini"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>` : ''}
                                            </div>
                                        </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="5" class="p-8 text-center text-slate-500 text-sm">Tiada aset dijumpai padan dengan carian.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function updateFilter(key, value) {
            STATE.filters[key] = value;
            renderApp();
            if(key === 'search') document.getElementById('searchAsset')?.focus();
        }

        function renderGenericTable(config) {
            const data = STATE.data[config.collection] || [];
            const isAdminView = isAdmin();
            
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full">
                    <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-50/50 rounded-t-xl">
                        <div class="text-sm font-medium text-slate-600">Jumlah Rekod: <span class="font-bold text-slate-800">${data.length}</span></div>
                        ${isAdminView ? `
                            <button onclick="openModal('${config.formModal}')" class="w-full sm:w-auto bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition-colors flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>

                            </button>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">

                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${data.length > 0 ? data.map(row => `
                                    <tr class="hover:bg-slate-50/70 transition-colors group">
                                        ${config.columns.map(c => `<td class="p-4 text-sm ${c.class||''} text-slate-700">${c.render(row)}</td>`).join('')}
                                        <td class="p-4 pr-6 text-right">
                                            <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                ${isAdminView && config.formModal ? `<button onclick="openModal('${config.formModal}', '${row.id}')" class="p-1.5 text-slate-600 hover:bg-slate-100 rounded-md" title="Kemaskini"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>` : ''}
                                                ${isAdminView && config.canDelete ? `<button onclick="deleteRecord('${config.collection}', '${row.id}')" class="p-1.5 text-red-600 hover:bg-red-50 rounded-md" title="Padam"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>` : ''}
                                            </div>
                                        </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="${config.columns.length + 1}" class="p-8 text-center text-slate-500 text-sm">Tiada rekod dijumpai.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderCurrentView() {
            switch(STATE.view) {
                case 'dashboard': return renderDashboard();
                case 'assets': return renderAssets();
                case 'movements': return renderGenericTable({
                    collection: 'movements', formModal: 'movementForm', canDelete: true,
                    columns: [
                        { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` },
                        { header: 'Peminjam', render: r => getEntityName('personnel', r.borrower_id) },
                        { header: 'Lokasi Baru', render: r => escapeHTML(r.new_location) },
                        { header: 'Tarikh Keluar', render: r => formatDate(r.out_date) },
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` }
                    ]
                });
                case 'maintenance': return renderGenericTable({
                    collection: 'maintenance', formModal: 'maintenanceForm', canDelete: true,
                    columns: [
                        { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` },
                        { header: 'Jenis Selenggara', render: r => escapeHTML(r.type) },
                        { header: 'Tarikh Mula', render: r => formatDate(r.start_date) },
                        { header: 'Kos', render: r => formatCurrency(r.cost) },
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` }
                    ]
                });
                case 'damage': return renderGenericTable({
                    collection: 'damage', formModal: 'damageForm', canDelete: true,
                    columns: [
                        { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` },
                        { header: 'Jenis Kerosakan', render: r => escapeHTML(r.damage_type) },
                        { header: 'Tarikh Lapor', render: r => formatDate(r.report_date) },
                        { header: 'Keutamaan', render: r => escapeHTML(r.priority) },
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` }
                    ]
                });
                case 'inspections': return renderGenericTable({
                    collection: 'inspections', formModal: 'inspectionForm', canDelete: true,
                    columns: [
                        { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` },
                        { header: 'Tarikh', render: r => formatDate(r.inspection_date) },
                        { header: 'Keadaan', render: r => escapeHTML(r.condition) },
                        { header: 'Pemeriksa', render: r => getEntityName('personnel', r.inspector_id) }
                    ]
                });
                case 'disposals': return renderGenericTable({
                    collection: 'disposals', formModal: 'disposalForm', canDelete: true,
                    columns: [
                        { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` },
                        { header: 'Kaedah', render: r => escapeHTML(r.method) },
                        { header: 'Tarikh Cadangan', render: r => formatDate(r.proposal_date) },
                        { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` }
                    ]
                });
                case 'setup_master': return renderSetupMaster();
                case 'audit_trail': return renderAuditTrail();
                case 'reports': return renderReports();
                default: return `<div class="p-8 text-center text-slate-500">Modul sedang dibangunkan.</div>`;
            }

        function renderSetupMaster() {
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${setupCard('Lokasi', 'locations', ['name', 'code'])}
                    ${setupCard('Kategori Aset', 'categories', ['name'])}
                    <div class="md:col-span-2">${setupCard('Senarai Pegawai / PIC', 'personnel', ['name', 'position', 'department'])}</div>
                </div>
            `;
        }

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-96">

        function renderAuditTrail() {
            const logs = STATE.data.audit_logs || [];
            return `
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6 flex gap-3 text-yellow-800 text-sm">
                    <svg class="w-5 h-5 shrink-0 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <p>Jejak audit ini dikawal sepenuhnya oleh <b>PostgreSQL Database Triggers</b>. Kod bahagian klien (HTML/JS) tidak boleh memadam atau mengubahsuai log ini demi memelihara integriti data jabatan.</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">

                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="p-4">Tarikh & Masa</th>
                                    <th class="p-4">Pengguna</th>
                                    <th class="p-4">Tindakan</th>
                                    <th class="p-4">Jadual</th>
                                    <th class="p-4">ID Rekod</th>
                                </tr>

                                    <tr class="hover:bg-slate-50">
                                        <td class="p-4 text-slate-500">${new Date(log.created_at).toLocaleString('ms-MY')}</td>
                                        <td class="p-4 text-slate-800">${escapeHTML(log.user_email)}</td>

                                        <td class="p-4 text-slate-600">${escapeHTML(log.table_name)}</td>

        function renderReports() {
             return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-10 max-w-3xl mx-auto text-center">
                    <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-3">Eksport Data Pangkalan</h2>
                    <p class="text-slate-500 mb-8">Muat turun salinan rekod aset secara penuh dalam format hamparan elektronik (CSV) yang boleh dibuka menggunakan Microsoft Excel.</p>
                    
                    <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2 mx-auto">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Muat Turun Senarai Aset Penuh (CSV)
                    </button>
                </div>
            `;
        }

        function exportCSV() {
            const data = STATE.data.assets;
            if(!data || data.length === 0) { showToast("Tiada data untuk dieksport.", "warning"); return; }
            
            const headers = ['ID', 'No Siri', 'Nama', 'Kategori', 'Lokasi', 'Kod Penempatan', 'Status', 'Catatan'];
            const csvRows = data.map(r => 
                [r.id, r.registration_no, r.name, r.category, r.location, r.placement_code, r.status, r.notes]
                .map(v => `"${(v || '').toString().replace(/"/g, '""')}"`).join(',')
            );
            
            const csvString = [headers.join(','), ...csvRows].join('\n');
            const blob = new Blob(["\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Aset_Biokimia_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ============================================================================
        // MODALS & FORMS
        // ============================================================================
        function openModal(type, id = null, collection = null) {
            STATE.modal = { type, id, collection };
            renderApp();
        }

        function closeModal() {
            STATE.modal = null;
            renderApp();
        }

        function renderModal() {
            const m = STATE.modal;
            let content = '';
            let title = '';
            let wide = false;

            if (m.type === 'assetProfile') { wide = true; title = 'Profil Aset Lengkap'; content = modalAssetProfile(m.id); }
            else if (m.type === 'assetForm') { wide = true; title = m.id ? 'Kemaskini Aset' : 'Daftar Aset Baru'; content = modalAssetForm(m.id); }
            else if (m.type === 'setupForm') { title = m.id ? 'Kemaskini Data' : 'Tambah Data'; content = modalSetupForm(m.id, m.collection); }
            else if (['maintenanceForm', 'damageForm', 'movementForm', 'inspectionForm', 'disposalForm'].includes(m.type)) {
                wide = true; title = m.id ? 'Kemaskini Rekod' : 'Tambah Rekod Baru'; content = modalLifecycleForm(m.type, m.id);
            }

            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-sm" onclick="if(event.target === this) closeModal()">
                    <div class="bg-white rounded-2xl shadow-2xl w-full ${wide ? 'max-w-4xl' : 'max-w-lg'} max-h-[95vh] flex flex-col transform transition-all duration-300 scale-100 opacity-100">
                        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
                            <h2 class="text-lg font-bold text-slate-800">${title}</h2>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 bg-white hover:bg-slate-100 rounded-full p-1.5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                        </div>
                        <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
                            ${content}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Asset Profile ---
        function modalAssetProfile(id) {
            const a = STATE.data.assets.find(x => x.id === id);
            if(!a) return '<p class="text-red-500">Aset tidak dijumpai.</p>';

            return `
                <div class="flex flex-col md:flex-row gap-8">
                    <!-- Left: Details -->
                    <div class="flex-1 space-y-6">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900 leading-tight">${escapeHTML(a.name)}</h1>
                            <p class="text-sm font-mono text-slate-500 mt-1">${escapeHTML(a.registration_no || a.id)}</p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-y-4 gap-x-6">
                            ${detailItem('Kategori', a.category)}
                            ${detailItem('Lokasi Semasa', a.location)}
                            ${detailItem('Kod Penempatan', a.placement_code)}
                            ${detailItem('Status', `<span class="px-2 py-0.5 text-xs font-bold rounded border ${getBadgeColor(a.status)}">${escapeHTML(a.status)}</span>`)}
                            <div class="col-span-2">${detailItem('Catatan', a.notes)}</div>
                        </div>
                    </div>
                    
                    <!-- Right: QR Code -->
                    <div class="w-full md:w-64 flex-shrink-0 flex flex-col items-center justify-start bg-slate-50 p-6 rounded-xl border border-slate-200">
                        <canvas id="qrCanvas" class="w-40 h-40 bg-white rounded-lg shadow-sm border border-slate-200 p-2"></canvas>
                        <p class="text-xs text-slate-500 font-medium mt-3 text-center uppercase tracking-widest">Imbas Kod QR</p>
                    </div>
                </div>
                ${isAdmin() ? `
                <div class="mt-8 pt-6 border-t border-slate-200 flex justify-end gap-3">
                    <button onclick="deleteRecord('assets', '${a.id}')" class="px-5 py-2.5 rounded-lg font-medium text-sm border border-red-200 text-red-600 hover:bg-red-50 transition-colors">Lupus/Padam Rekod</button>
                    <button onclick="openModal('assetForm', '${a.id}')" class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-primary hover:bg-blue-700 text-white shadow-sm transition-colors">Kemaskini Aset</button>
                </div>` : ''}
            `;
        }

        function detailItem(label, value) {
            return `<div><p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${label}</p><div class="text-sm text-slate-800 font-medium">${value || '-'}</div></div>`;
        }

        function generateQRCode() {
            const canvas = document.getElementById('qrCanvas');
            if (canvas && STATE.modal.type === 'assetProfile') {
                new QRious({
                    element: canvas,
                    value: `https://vri-biokimia.web.app/?asset=${STATE.modal.id}`, // Placeholder URL
                    size: 200,
                    level: 'H',
                    foreground: '#0F1E36'
                });
            }
        }

        // --- Asset Form ---
        function modalAssetForm(id) {
            const a = id ? STATE.data.assets.find(x => x.id === id) : {};
            
            return `
                <form onsubmit="saveAsset(event, '${id || ''}')" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama / Keterangan Aset <span class="text-red-500">*</span></label>
                            <input type="text" id="f_name" value="${escapeHTML(a.name || '')}" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">No. Siri / No. Pendaftaran</label>
                            <input type="text" id="f_regNo" value="${escapeHTML(a.registration_no || '')}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none font-mono">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Status Semasa <span class="text-red-500">*</span></label>
                            <select id="f_status" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                                ${STATUS_OPTIONS.map(s => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Kategori</label>
                            <select id="f_category" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                                <option value="">- Pilih Kategori -</option>
                                ${STATE.data.categories.map(c => `<option value="${c.name || c.nama}" ${a.category === (c.name || c.nama) ? 'selected' : ''}>${c.name || c.nama}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Lokasi Semasa</label>
                            <select id="f_location" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                                <option value="">- Pilih Lokasi -</option>
                                ${STATE.data.locations.map(l => `<option value="${l.name || l.nama}" ${a.location === (l.name || l.nama) ? 'selected' : ''}>${l.name || l.nama}</option>`).join('')}
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Catatan Tambahan</label>
                            <textarea id="f_notes" rows="3" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">${escapeHTML(a.notes || '')}</textarea>
                        </div>
                    </div>
                    <div class="pt-5 border-t border-slate-200 flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-lg font-medium text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 transition-colors">Batal</button>
                        <button type="submit" id="saveBtn" class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-primary hover:bg-blue-700 text-white shadow-sm transition-colors flex items-center justify-center min-w-[120px]">Simpan Rekod</button>
                    </div>
                </form>
            `;
        }

        async function saveAsset(e, id) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = `<div class="loader w-4 h-4 border-2"></div>`;
            btn.disabled = true;

            const payload = {
                name: document.getElementById('f_name').value,
                registration_no: document.getElementById('f_regNo').value,
                status: document.getElementById('f_status').value,
                category: document.getElementById('f_category').value || null,
                location: document.getElementById('f_location').value || null,
                notes: document.getElementById('f_notes').value
            };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('assets').update(payload).eq('id', id);
                    if (error) throw error;
                    showToast("Maklumat aset berjaya dikemaskini.");
                } else {
                    payload.id = generateID();
                    const { error } = await supabaseClient.from('assets').insert([payload]);
                    if (error) throw error;
                    showToast("Aset baru berjaya didaftarkan.");
                }
                await fetchAllData();
                closeModal();
            } catch (err) {
                showToast(err.message, "error");
                btn.innerHTML = `Simpan Rekod`;
                btn.disabled = false;
            }
        }

        // --- Master Data Setup Form ---
        function modalSetupForm(id, collection) {
            const item = id ? STATE.data[collection].find(x => x.id === id) : {};
            let isPersonnel = collection === 'personnel';

            return `
                <form onsubmit="saveSetup(event, '${id || ''}', '${collection}')" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Nama <span class="text-red-500">*</span></label>
                        <input type="text" id="s_name" value="${escapeHTML(item.nama || item.name || '')}" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    ${isPersonnel ? `
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Jawatan</label>
                            <input type="text" id="s_pos" value="${escapeHTML(item.jawatan || item.position || '')}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        </div>
                    ` : ''}
                    <div class="pt-5 border-t border-slate-200 flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-lg font-medium text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 transition-colors">Batal</button>
                        <button type="submit" id="saveSetupBtn" class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-primary hover:bg-blue-700 text-white shadow-sm transition-colors flex items-center justify-center min-w-[120px]">Simpan</button>
                    </div>
                </form>
            `;
        }

        async function saveSetup(e, id, collection) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            
            const btn = document.getElementById('saveSetupBtn');
            btn.innerHTML = `<div class="loader w-4 h-4 border-2"></div>`;
            btn.disabled = true;

            const nameVal = document.getElementById('s_name').value;
            // Depending on how DB schema was created, handle 'name' vs 'nama'
            const payload = collection === 'personnel' 
                ? { nama: nameVal, jawatan: document.getElementById('s_pos').value } 
                : { nama: nameVal }; // fallback mostly to 'nama' based on original HTML

            try {
                if (id) {
                    const { error } = await supabaseClient.from(collection).update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from(collection).insert([payload]);
                    if (error) throw error;
                }
                showToast("Data induk berjaya disimpan.");
                await fetchAllData();
                closeModal();
            } catch (err) {
                showToast(err.message, "error");
                btn.innerHTML = `Simpan`;
                btn.disabled = false;
            }
        }

        // --- Lifecycle Forms (Generic Wrapper) ---
        function modalLifecycleForm(type, id) {
            // Mapping modal type to collection
            const collectionMap = {
                'maintenanceForm': 'maintenance', 'damageForm': 'damage', 
                'movementForm': 'movements', 'inspectionForm': 'inspections', 'disposalForm': 'disposals'
            };
            const collection = collectionMap[type];
            const item = id ? STATE.data[collection].find(x => x.id === id) : {};
            
            const assetOptions = STATE.data.assets.map(a => `<option value="${a.id}" ${item.asset_id === a.id ? 'selected' : ''}>${escapeHTML(a.registration_no || a.id)} - ${escapeHTML(a.name).substring(0,30)}</option>`).join('');
            
            let fieldsHtml = `
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Aset Berkaitan <span class="text-red-500">*</span></label>
                    <select id="lc_asset_id" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                        <option value="">- Cari dan Pilih Aset -</option>
                        ${assetOptions}
                    </select>
                </div>
            `;

            if (type === 'maintenanceForm') {
                fieldsHtml += `
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Jenis Selenggara</label><input type="text" id="lc_type" value="${escapeHTML(item.type||'')}" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Status</label><select id="lc_status" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white"><option value="DIJADUALKAN" ${item.status==='DIJADUALKAN'?'selected':''}>Dijadualkan</option><option value="SELESAI" ${item.status==='SELESAI'?'selected':''}>Selesai</option></select></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Tarikh Mula</label><input type="date" id="lc_date" value="${item.start_date||''}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Kos (RM)</label><input type="number" step="0.01" id="lc_cost" value="${item.cost||''}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                `;
            } else if (type === 'damageForm') {
                fieldsHtml += `
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Kerosakan</label><input type="text" id="lc_type" value="${escapeHTML(item.damage_type||'')}" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Status</label><select id="lc_status" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white"><option value="DILAPORKAN" ${item.status==='DILAPORKAN'?'selected':''}>Dilaporkan</option><option value="DALAM PEMBAIKAN" ${item.status==='DALAM PEMBAIKAN'?'selected':''}>Dalam Pembaikan</option><option value="SELESAI" ${item.status==='SELESAI'?'selected':''}>Selesai</option></select></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Tarikh</label><input type="date" id="lc_date" value="${item.report_date||''}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                `;
            } else if (type === 'movementForm') {
                 fieldsHtml += `
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Lokasi Baru</label><input type="text" id="lc_loc" value="${escapeHTML(item.new_location||'')}" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Status</label><select id="lc_status" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white"><option value="DIPINJAM" ${item.status==='DIPINJAM'?'selected':''}>Dipinjam</option><option value="DIPULANGKAN" ${item.status==='DIPULANGKAN'?'selected':''}>Dipulangkan</option></select></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Tarikh Keluar</label><input type="date" id="lc_date" value="${item.out_date||''}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                `;
            } else {
                 fieldsHtml += `
                    <div class="md:col-span-2 p-4 bg-yellow-50 text-yellow-800 text-sm rounded-lg border border-yellow-200">Borang spesifik untuk modul ini sedang dinaik taraf. Hubungi Pentadbir.</div>
                 `;
            }

            return `
                <form onsubmit="saveLifecycle(event, '${id || ''}', '${collection}')" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${fieldsHtml}
                    </div>
                    <div class="pt-5 border-t border-slate-200 flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-lg font-medium text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 transition-colors">Batal</button>
                        <button type="submit" id="saveLcBtn" class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-primary hover:bg-blue-700 text-white shadow-sm transition-colors flex items-center justify-center min-w-[120px]">Simpan Rekod</button>
                    </div>
                </form>
            `;
        }

        async function saveLifecycle(e, id, collection) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            
            const btn = document.getElementById('saveLcBtn');
            if(btn) { btn.innerHTML = `<div class="loader w-4 h-4 border-2"></div>`; btn.disabled = true; }

            const payload = { asset_id: document.getElementById('lc_asset_id').value };
            
            // Map inputs based on collection
            if (collection === 'maintenance') {
                payload.type = document.getElementById('lc_type').value;
                payload.status = document.getElementById('lc_status').value;
                payload.start_date = document.getElementById('lc_date').value || null;
                payload.cost = document.getElementById('lc_cost').value || 0;
            } else if (collection === 'damage') {
                payload.damage_type = document.getElementById('lc_type').value;
                payload.status = document.getElementById('lc_status').value;
                payload.report_date = document.getElementById('lc_date').value || null;
            } else if (collection === 'movements') {
                payload.new_location = document.getElementById('lc_loc').value;
                payload.status = document.getElementById('lc_status').value;
                payload.out_date = document.getElementById('lc_date').value || null;
            }

            try {
                if (id) {
                    const { error } = await supabaseClient.from(collection).update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from(collection).insert([payload]);
                    if (error) throw error;
                }
                showToast("Transaksi berjaya direkodkan.");
                await fetchAllData();
                closeModal();
            } catch (err) {
                showToast(err.message, "error");
                if(btn) { btn.innerHTML = `Simpan Rekod`; btn.disabled = false; }
            }
        }

        async function deleteRecord(collection, id) {
            if(!checkAdminAction()) return;
            if(!confirm("Adakah anda pasti untuk memadam rekod ini secara kekal? (Aktiviti ini akan dicatatkan dalam Jejak Audit)")) return;
            
            try {
                // If it's asset, we recommend soft delete, but for this generic function we call delete
                if(collection === 'assets') {
                    // Soft delete logic to adhere to government regulations
                    const { error } = await supabaseClient.from('assets').update({ is_deleted: true, status: 'DILUPUSKAN' }).eq('id', id);
                    if (error) throw error;
                    showToast("Aset telah berjaya dilupus/dipadamkan (Soft Delete).");
                } else {
                    const { error } = await supabaseClient.from(collection).delete().eq('id', id);
                    if (error) throw error;
                    showToast("Rekod berjaya dipadamkan.");
                }
                
                await fetchAllData();
                renderApp();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        // Run application
        initApp();
    </script>
</body>
