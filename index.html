<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Aset Alih - Seksyen Biokimia VRI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- QRious untuk QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <script>
        // Konfigurasi Tailwind Kustom
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563AB', navy: { 800: '#1e293b', 900: '#0f172a' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #2563AB; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .nav-item { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.08); border-left-color: #3b82f6; color: white; font-weight: 600; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">
    <div id="app" class="w-full h-full flex"></div>
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const SUPABASE_URL = "https://lohbpqkldrdagkbhbxka.supabase.co"; // Cth: https://xxxxx.supabase.co
        const SUPABASE_ANON_KEY = "sb_publishable_o3vJ1G77WzvSkei-hS7dNg_oTJepoIA";

        let supabaseClient;
        let statusChartInstance = null; // Pembolehubah global untuk carta

        const STATE = {
            user: null,
            profile: null,
            view: 'dashboard',
            loading: true,
            modal: null,
            sidebarOpen: false,
            data: {
                assets: [], locations: [], categories: [], personnel: [],
                maintenance: [], damage: [], movements: [], inspections: [],
                disposals: [], audit_logs: [], user_profiles: []
            },
            filters: { search: '', status: '' }
        };

        const STATUS_OPTIONS = ["MASIH DIGUNAKAN", "ROSAK", "CADANG LUPUS", "DILUPUSKAN", "DIPINJAM", "DISELENGGARA"];

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-600' : (type === 'warning' ? 'bg-amber-500' : 'bg-green-600');
            toast.className = `${bg} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-4 opacity-0`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getBadgeColor(status) {
            switch((status || '').toUpperCase()) {
                case 'MASIH DIGUNAKAN': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'ROSAK': return 'bg-red-100 text-red-800 border-red-200';
                case 'CADANG LUPUS': return 'bg-orange-100 text-orange-800 border-orange-200';
                case 'DILUPUSKAN': return 'bg-slate-100 text-slate-600 border-slate-200';
                case 'DIPINJAM': return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'DISELENGGARA': return 'bg-purple-100 text-purple-800 border-purple-200';
                case 'SELESAI': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                default: return 'bg-gray-100 text-gray-800 border-gray-200';
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function isAdmin() { return STATE.profile && STATE.profile.role === 'ADMIN'; }
        
        function checkAdminAction() {
            if (!isAdmin()) { showToast("Akses Ditolak: Memerlukan peranan Admin.", "error"); return false; }
            return true;
        }

        function getEntityName(collection, id) {
            if (!id) return '-';
            const item = STATE.data[collection]?.find(x => x.id === id);
            return item ? (item.nama || item.name || id) : id;
        }

        async function initApp() {
            if (!SUPABASE_URL || SUPABASE_URL.includes("MASUKKAN_URL")) {
                document.getElementById('app').innerHTML = `
                    <div class="w-full h-full flex items-center justify-center bg-slate-900 text-white p-6">
                        <div class="max-w-md text-center">
                            <h2 class="text-2xl font-bold text-red-400 mb-4">Sistem Belum Disambungkan</h2>
                            <p class="text-slate-300">Sila masukkan <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> di dalam fail kod HTML anda.</p>
                        </div>
                    </div>`;
                return;
            }

            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    STATE.user = session.user;
                    await fetchUserProfile();
                    await fetchAllData();
                    STATE.loading = false;
                    renderApp();
                } else {
                    STATE.user = null; STATE.profile = null; STATE.loading = false;
                    renderApp();
                }
            });
        }

        async function fetchUserProfile() {
            try {
                const { data } = await supabaseClient.from('user_profiles').select('*').eq('id', STATE.user.id).single();
                STATE.profile = data || { role: 'USER', email: STATE.user.email, name: STATE.user.email.split('@')[0] };
            } catch (e) { STATE.profile = { role: 'USER', email: STATE.user.email }; }
        }

        async function fetchAllData() {
            try {
                const tables = ['assets', 'locations', 'categories', 'personnel', 'maintenance', 'damage', 'movements', 'disposals'];
                const promises = tables.map(t => supabaseClient.from(t).select('*'));
                const results = await Promise.all(promises);

                tables.forEach((table, index) => { if (results[index].data) STATE.data[table] = results[index].data; });

                if (isAdmin()) {
                    const { data: audits } = await supabaseClient.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(100);
                    if (audits) STATE.data.audit_logs = audits;
                    
                    const { data: users } = await supabaseClient.from('user_profiles').select('*').order('created_at', { ascending: false });
                    if (users) STATE.data.user_profiles = users;
                }
                
                // Inspections fallback
                try {
                    const { data } = await supabaseClient.from('inspections').select('*');
                    if (data) STATE.data.inspections = data;
                } catch(e) { STATE.data.inspections = []; }

            } catch (e) { showToast("Gagal memuat turun data pelayan.", "error"); console.error(e); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<div class="loader mx-auto border-white"></div>`; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                const errDiv = document.getElementById('loginError');
                errDiv.classList.remove('hidden'); errDiv.innerText = error.message;
                btn.innerHTML = `Log Masuk`; btn.disabled = false;
            } else { showToast("Log masuk berjaya."); }
        }

        function renderApp() {
            const root = document.getElementById('app');

            if (STATE.loading) {
                root.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center bg-slate-50"><div class="loader mb-4"></div><p class="text-slate-500 font-medium">Menyambung ke Pangkalan Data...</p></div>`;
                return;
            }

            if (!STATE.user) {
                root.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center bg-slate-900" style="background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px;">
                        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                            <div class="bg-primary px-8 py-6 text-white text-center">
                                <h1 class="text-2xl font-bold tracking-tight">Aset Alih Biokimia</h1>
                                <p class="text-blue-100 text-sm mt-1">Institut Penyelidikan Veterinar (VRI)</p>
                            </div>
                            <div class="p-8">
                                <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                                    <div id="loginError" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 text-center font-medium"></div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">E-mel Kakitangan</label>
                                        <input type="email" id="email" required class="w-full px-4 py-2.5 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:bg-white outline-none transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kata Laluan</label>
                                        <input type="password" id="password" required class="w-full px-4 py-2.5 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:bg-white outline-none transition-all">
                                    </div>
                                    <button type="submit" id="loginBtn" class="mt-4 w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors">Log Masuk</button>
                                </form>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            root.innerHTML = `
                <!-- Sidebar -->
                <aside class="${STATE.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} fixed lg:relative z-40 w-64 h-full bg-navy-900 text-slate-300 flex flex-col transition-transform duration-300 lg:translate-x-0 shadow-xl">
                    <div class="p-5 border-b border-white/10">
                        <h2 class="text-white font-bold text-lg leading-tight">Biokimia VRI</h2>
                        <p class="text-xs text-blue-400">Pengurusan Aset Pintar</p>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-1 custom-scrollbar">
                        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-2 px-5">Utama</div>
                        ${navLink('dashboard', 'Papan Pemuka', 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6')}
                        ${navLink('assets', 'Senarai Aset', 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4')}
                        
                        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-5 px-5">Operasi</div>
                        ${navLink('movements', 'Pergerakan & Pinjaman', 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4')}
                        ${navLink('maintenance', 'Penyelenggaraan', 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z')}
                        ${navLink('damage', 'Laporan Kerosakan', 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z')}
                        ${navLink('disposals', 'Pelupusan', 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16')}
                        
                        ${isAdmin() ? `
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 mt-5 px-5">Laporan & Tetapan Admin</div>
                            ${navLink('users', 'Pengurusan Pengguna', 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z')}
                            ${navLink('setup_master', 'Data Induk (Rujukan)', 'M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4')}
                            ${navLink('audit_trail', 'Jejak Audit Sistem', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z')}
                        ` : ''}
                    </div>

                    <div class="p-4 bg-navy-800 border-t border-white/10">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm">
                                ${(STATE.profile?.name || STATE.user.email).substring(0,2).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-white truncate">${escapeHTML(STATE.profile?.name || STATE.user.email)}</p>
                                <p class="text-[10px] text-blue-300 font-bold tracking-wider">${STATE.profile?.role || 'USER'}</p>
                            </div>
                        </div>
                        <button onclick="supabaseClient.auth.signOut()" class="w-full bg-white/10 hover:bg-red-500/80 text-white text-xs font-bold py-2 rounded transition-colors">Log Keluar</button>
                    </div>
                </aside>

                <!-- Overlay Mobile -->
                <div onclick="STATE.sidebarOpen=false; renderApp()" class="fixed inset-0 bg-slate-900/60 z-30 lg:hidden ${STATE.sidebarOpen ? 'block' : 'hidden'}"></div>

                <!-- Main Content -->
                <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
                    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center gap-4 shadow-sm z-10">
                        <button onclick="STATE.sidebarOpen=true; renderApp()" class="lg:hidden text-slate-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                        <h1 class="text-lg font-bold text-slate-800">${getViewTitle()}</h1>
                        <div class="ml-auto flex items-center gap-2">
                            <span class="inline-flex items-center gap-1.5 text-xs font-medium bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full border border-emerald-100">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Bersambung
                            </span>
                        </div>
                    </header>
                    
                    <div class="flex-1 overflow-y-auto p-4 sm:p-6 custom-scrollbar">
                        <div class="max-w-7xl mx-auto space-y-6">
                            ${renderCurrentView()}
                        </div>
                    </div>
                </main>
                ${STATE.modal ? renderModal() : ''}
            `;

            if (STATE.view === 'dashboard') initCharts();
            if (STATE.modal?.type === 'assetProfile') generateQRCode();
        }

        function navLink(key, label, svgPath) {
            const isActive = STATE.view === key;
            return `
                <button onclick="STATE.view='${key}'; STATE.sidebarOpen=false; renderApp()" class="nav-item ${isActive ? 'active' : ''} w-full flex items-center gap-3 px-5 py-2.5 text-sm text-left">
                    <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${svgPath}"></path></svg>
                    ${label}
                </button>`;
        }

        function getViewTitle() {
            const t = { dashboard: 'Papan Pemuka', assets: 'Senarai Aset Penuh', movements: 'Pergerakan & Pinjaman', maintenance: 'Penyelenggaraan Aset', damage: 'Laporan Kerosakan', disposals: 'Pelupusan Aset', users: 'Pengurusan Sistem & Pengguna', setup_master: 'Data Rujukan Induk', audit_trail: 'Jejak Audit Pangkalan Data' };
            return t[STATE.view] || 'Sistem Aset';
        }

        function renderCurrentView() {
            switch(STATE.view) {
                case 'dashboard': return renderDashboard();
                case 'assets': return renderAssets();
                case 'users': return renderUsers();
                case 'setup_master': return renderSetupMaster();
                case 'audit_trail': return renderAuditTrail();
                case 'movements': return renderGenericTable({ collection: 'movements', formModal: 'movementForm', columns: [ { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, { header: 'Lokasi Baru', render: r => escapeHTML(r.new_location) }, { header: 'Tarikh Keluar', render: r => formatDate(r.out_date) }, { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } ] });
                case 'maintenance': return renderGenericTable({ collection: 'maintenance', formModal: 'maintenanceForm', columns: [ { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, { header: 'Tarikh Mula', render: r => formatDate(r.start_date) }, { header: 'Kos (RM)', render: r => parseFloat(r.cost||0).toFixed(2) }, { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } ] });
                case 'damage': return renderGenericTable({ collection: 'damage', formModal: 'damageForm', columns: [ { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, { header: 'Kerosakan', render: r => escapeHTML(r.damage_type) }, { header: 'Tarikh Lapor', render: r => formatDate(r.report_date) }, { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } ] });
                case 'disposals': return renderGenericTable({ collection: 'disposals', formModal: 'disposalForm', columns: [ { header: 'Aset', render: r => `<span class="font-medium text-slate-900">${getEntityName('assets', r.asset_id)}</span>` }, { header: 'Kaedah', render: r => escapeHTML(r.method) }, { header: 'Tarikh', render: r => formatDate(r.proposal_date) }, { header: 'Status', render: r => `<span class="px-2 py-0.5 text-[10px] font-bold rounded border ${getBadgeColor(r.status)}">${escapeHTML(r.status)}</span>` } ] });
                default: return `<div class="p-8 text-center text-slate-500">Pembangunan dalam proses.</div>`;
            }
        }

        function renderDashboard() {
            const assets = STATE.data.assets.filter(a => !a.is_deleted) || [];
            const activeCount = assets.filter(a => a.status === 'MASIH DIGUNAKAN').length;
            const brokenCount = assets.filter(a => a.status?.includes('ROSAK')).length;
            
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-primary flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4"></path></svg></div>
                        <div><p class="text-2xl font-bold text-slate-800">${assets.length}</p><p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Jumlah Keseluruhan Aset</p></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                        <div><p class="text-2xl font-bold text-slate-800">${activeCount}</p><p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Aktif Digunakan</p></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>
                        <div><p class="text-2xl font-bold text-slate-800">${brokenCount}</p><p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Aset Rosak/Aduan</p></div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 w-full md:w-1/2">
                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4">Pecahan Status Aset</h3>
                    <div class="relative w-full h-64">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            `;
        }

        function initCharts() {
            const ctx = document.getElementById('statusChart');
            if (!ctx) return;

            // Padam carta lama jika wujud untuk elak 'infinite loop'
            if (statusChartInstance) statusChartInstance.destroy();

            const statusCounts = {};
            STATE.data.assets.filter(a => !a.is_deleted).forEach(a => {
                const s = a.status || 'TIDAK DIKETAHUI';
                statusCounts[s] = (statusCounts[s] || 0) + 1;
            });

            // Pastikan maintainAspectRatio: false wujud
            statusChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#10B981', '#EF4444', '#F59E0B', '#64748B', '#3B82F6', '#8B5CF6'],
                        borderWidth: 2, borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { family: 'Inter', size: 11 } } } }
                }
            });
        }

        function renderAssets() {
            let filtered = STATE.data.assets.filter(a => !a.is_deleted).filter(a => {
                const matchSearch = !STATE.filters.search || (a.name?.toLowerCase().includes(STATE.filters.search.toLowerCase()) || a.registration_no?.toLowerCase().includes(STATE.filters.search.toLowerCase()));
                const matchStatus = !STATE.filters.status || a.status === STATE.filters.status;
                return matchSearch && matchStatus;
            });

            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-50/50 rounded-t-xl">
                        <div class="flex flex-1 w-full gap-2">
                            <input type="text" placeholder="Cari nama atau no. siri..." value="${escapeHTML(STATE.filters.search)}" oninput="STATE.filters.search=this.value; renderApp();" class="flex-1 max-w-sm px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            <select onchange="STATE.filters.status=this.value; renderApp();" class="py-2 px-3 text-sm border border-slate-300 rounded-lg outline-none bg-white">
                                <option value="">Semua Status</option>
                                ${STATUS_OPTIONS.map(s => `<option value="${s}" ${STATE.filters.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                        ${isAdmin() ? `<button onclick="STATE.modal={type:'assetForm'}; renderApp();" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">+ Daftar Aset</button>` : ''}
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="p-4 pl-6">No. Siri</th><th class="p-4">Maklumat Aset</th><th class="p-4">Status</th><th class="p-4 text-right pr-6">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filtered.length > 0 ? filtered.map(a => `
                                    <tr class="hover:bg-slate-50/70 group">
                                        <td class="p-4 pl-6 text-sm font-mono font-medium text-slate-800">${escapeHTML(a.registration_no || a.id)}</td>
                                        <td class="p-4"><p class="text-sm font-semibold text-slate-800 line-clamp-1">${escapeHTML(a.name)}</p><p class="text-xs text-slate-500 mt-0.5">${escapeHTML(a.category || '-')}</p></td>
                                        <td class="p-4"><span class="px-2.5 py-1 text-[10px] font-bold rounded-full border ${getBadgeColor(a.status)} whitespace-nowrap">${escapeHTML(a.status)}</span></td>
                                        <td class="p-4 pr-6 text-right">
                                            <button onclick="STATE.modal={type:'assetProfile', id:'${a.id}'}; renderApp();" class="text-xs font-semibold text-primary hover:underline">Profil</button>
                                        </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="4" class="p-8 text-center text-slate-500 text-sm">Tiada aset dijumpai.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderUsers() {
            if(!isAdmin()) return '<div class="p-4 text-red-500">Akses ditolak.</div>';
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50 rounded-t-xl">
                        <h2 class="font-bold text-slate-800">Senarai Pengguna Sistem</h2>
                        <button onclick="STATE.modal={type:'userForm'}; renderApp();" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">+ Tambah Pengguna</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider"><th class="p-4">Nama</th><th class="p-4">E-mel</th><th class="p-4">Peranan</th><th class="p-4">Tarikh Daftar</th></tr></thead>
                            <tbody class="divide-y divide-slate-100">
                                ${STATE.data.user_profiles.map(u => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-4 text-sm font-medium text-slate-800">${escapeHTML(u.name || '-')}</td>
                                        <td class="p-4 text-sm text-slate-600">${escapeHTML(u.email)}</td>
                                        <td class="p-4"><span class="px-2 py-1 text-[10px] font-bold rounded-md ${u.role==='ADMIN'?'bg-primary text-white':'bg-slate-200 text-slate-700'}">${escapeHTML(u.role)}</span></td>
                                        <td class="p-4 text-sm text-slate-500">${formatDate(u.created_at)}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderGenericTable(config) {
            const data = STATE.data[config.collection] || [];
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50 rounded-t-xl">
                        <h2 class="font-bold text-slate-800">Senarai Rekod</h2>
                        ${isAdmin() ? `<button onclick="STATE.modal={type:'${config.formModal}'}; renderApp();" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">+ Tambah Rekod</button>` : ''}
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">${config.columns.map(c => `<th class="p-4">${c.header}</th>`).join('')}</tr></thead>
                            <tbody class="divide-y divide-slate-100">
                                ${data.length ? data.map(row => `<tr class="hover:bg-slate-50">${config.columns.map(c => `<td class="p-4 text-sm text-slate-700">${c.render(row)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${config.columns.length}" class="p-8 text-center text-slate-500 text-sm">Tiada rekod.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderSetupMaster() { return '<div class="p-8 text-center text-slate-500 bg-white rounded-xl border border-slate-200">Pengurusan data induk. (Pembangunan berterusan)</div>'; }
        
        function renderAuditTrail() {
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider"><th class="p-4">Tarikh</th><th class="p-4">Pengguna</th><th class="p-4">Tindakan</th><th class="p-4">Jadual</th></tr></thead>
                            <tbody class="divide-y divide-slate-100 text-sm font-mono">
                                ${STATE.data.audit_logs.map(log => `<tr class="hover:bg-slate-50"><td class="p-4 text-slate-500">${formatDate(log.created_at)}</td><td class="p-4 text-slate-800">${escapeHTML(log.user_email)}</td><td class="p-4 font-bold ${log.action === 'DELETE' ? 'text-red-600' : 'text-primary'}">${escapeHTML(log.action)}</td><td class="p-4 text-slate-600">${escapeHTML(log.table_name)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderModal() {
            const m = STATE.modal;
            let content = ''; let title = '';
            
            if (m.type === 'assetProfile') { title = 'Profil Aset Lengkap'; content = modalAssetProfile(m.id); }
            else if (m.type === 'assetForm') { title = m.id ? 'Kemaskini Aset' : 'Daftar Aset Baru'; content = modalAssetForm(m.id); }
            else if (m.type === 'userForm') { title = 'Tambah Pengguna Baru'; content = modalUserForm(); }
            else if (['maintenanceForm', 'damageForm', 'movementForm', 'disposalForm'].includes(m.type)) { title = 'Borang Transaksi'; content = modalLifecycleForm(m.type, m.id); }

            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onclick="if(event.target === this){ STATE.modal=null; renderApp(); }">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
                        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
                            <h2 class="text-lg font-bold text-slate-800">${title}</h2>
                            <button onclick="STATE.modal=null; renderApp();" class="text-slate-400 hover:text-slate-700 bg-white rounded-full p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                        </div>
                        <div class="p-6 overflow-y-auto custom-scrollbar flex-1">${content}</div>
                    </div>
                </div>
            `;
        }

        function modalAssetProfile(id) {
            const a = STATE.data.assets.find(x => x.id === id);
            return `
                <div class="flex gap-8">
                    <div class="flex-1 space-y-4">
                        <h1 class="text-xl font-bold text-slate-900">${escapeHTML(a.name)}</h1>
                        <p class="text-sm font-mono text-slate-500">${escapeHTML(a.registration_no || a.id)}</p>
                        <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
                            <div><p class="text-xs font-semibold text-slate-400 uppercase">Kategori</p><p class="font-medium text-slate-800">${escapeHTML(a.category || '-')}</p></div>
                            <div><p class="text-xs font-semibold text-slate-400 uppercase">Lokasi</p><p class="font-medium text-slate-800">${escapeHTML(a.location || '-')}</p></div>
                            <div><p class="text-xs font-semibold text-slate-400 uppercase">Status</p><span class="px-2 py-0.5 text-[10px] font-bold rounded-full border ${getBadgeColor(a.status)}">${escapeHTML(a.status)}</span></div>
                        </div>
                    </div>
                    <div class="w-48 flex-shrink-0 flex flex-col items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <canvas id="qrCanvas" class="w-32 h-32 bg-white rounded-lg p-2"></canvas>
                        <p class="text-[10px] text-slate-500 font-bold mt-2 uppercase">Kod QR Sistem</p>
                    </div>
                </div>
                ${isAdmin() ? `<div class="mt-6 pt-4 border-t border-slate-200 flex justify-end gap-3"><button onclick="deleteRecord('assets', '${a.id}')" class="px-4 py-2 rounded-lg font-medium text-sm text-red-600 border border-red-200 hover:bg-red-50">Lupus / Padam</button></div>` : ''}
            `;
        }

        function generateQRCode() {
            const canvas = document.getElementById('qrCanvas');
            if (canvas && STATE.modal.type === 'assetProfile') {
                new QRious({ element: canvas, value: `https://vri-biokimia.web.app/?asset=${STATE.modal.id}`, size: 150, level: 'H' });
            }
        }

        function modalUserForm() {
            return `
                <form onsubmit="saveUserForm(event)" class="space-y-4">
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Nama Penuh <span class="text-red-500">*</span></label><input type="text" id="u_name" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">E-mel Log Masuk <span class="text-red-500">*</span></label><input type="email" id="u_email" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Kata Laluan Awal <span class="text-red-500">*</span></label><input type="text" id="u_pass" required minlength="6" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"></div>
                    <div><label class="block text-sm font-semibold text-slate-700 mb-1">Peranan Sistem</label>
                        <select id="u_role" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                            <option value="USER">USER (Baca Sahaja)</option><option value="ADMIN">ADMIN (Akses Penuh)</option>
                        </select>
                    </div>
                    <div class="pt-4 flex justify-end gap-3"><button type="submit" id="saveUserBtn" class="px-5 py-2 bg-primary text-white rounded-lg text-sm font-bold shadow-sm">Daftar Pengguna</button></div>
                </form>
            `;
        }

        async function saveUserForm(e) {
            e.preventDefault();
            if(!checkAdminAction()) return;
            
            const btn = document.getElementById('saveUserBtn');
            btn.innerHTML = `<div class="loader w-4 h-4 border-2"></div>`; btn.disabled = true;

            try {
                // Memanggil Fungsi RPC PostgreSQL untuk cipta akaun dan bypass pengesahan e-mel
                const { error } = await supabaseClient.rpc('admin_create_user', {
                    email: document.getElementById('u_email').value.trim().toLowerCase(),
                    password: document.getElementById('u_pass').value.trim(),
                    full_name: document.getElementById('u_name').value.trim(),
                    user_role: document.getElementById('u_role').value
                });

                if (error) throw error;
                showToast("Pengguna baharu berjaya didaftarkan.");
                await fetchAllData();
                STATE.modal = null;
                renderApp();
            } catch (err) {
                showToast(err.message, "error");
                btn.innerHTML = `Daftar Pengguna`; btn.disabled = false;
            }
        }

        function modalAssetForm(id) { return '<div class="text-center text-sm text-slate-500">Borang Aset sedang disatukan...</div>'; }
        function modalLifecycleForm(type, id) { return '<div class="text-center text-sm text-slate-500">Borang Transaksi sedang disatukan...</div>'; }

        async function deleteRecord(collection, id) {
            if(!checkAdminAction() || !confirm("Adakah anda pasti? Rekod akan ditanda sebagai dilupuskan/dipadam.")) return;
            try {
                if(collection === 'assets') {
                    const { error } = await supabaseClient.from('assets').update({ is_deleted: true, status: 'DILUPUSKAN' }).eq('id', id);
                    if (error) throw error;
                }
                showToast("Tindakan berjaya.");
                await fetchAllData();
                STATE.modal = null; renderApp();
            } catch (err) { showToast(err.message, "error"); }
        }

        initApp();
    </script>
</body>
</html>
