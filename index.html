<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sistem Pengurusan Aset Alih - Seksyen Biokimia VRI Ipoh</title>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Chart.js for Dashboard Graphs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- QR Code Generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
:root{
  --navy:#1F3864; --navy-dark:#14294A; --navy-light:#2E5090;
  --bg:#F4F6F9; --card:#FFFFFF; --border:#E2E6ED; --text:#1D2733; --muted:#6B7686;
  --green:#1E8E5A; --green-bg:#E6F4EC;
  --red:#C0392B; --red-bg:#FBEAE8;
  --orange:#B9770E; --orange-bg:#FCF1DE;
  --grey:#6B7280; --grey-bg:#EEF0F3;
  --blue:#2563AB; --blue-bg:#E7EFFA;
  --purple:#7E3F98; --purple-bg:#F1E7F5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;}
#app{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ---- Login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy-dark),var(--navy-light));}
.login-card{background:#fff;border-radius:12px;padding:36px 40px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.login-card h1{font-size:18px;color:var(--navy);margin:0 0 4px;}
.login-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 5px;}
.login-card input,.login-card select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;}
.login-card button.primary{width:100%;margin-top:20px;background:var(--navy);color:#fff;border:none;
  padding:11px;border-radius:7px;font-weight:600;font-size:14px;}
.login-card button.primary:hover{background:var(--navy-light);}
.login-err{background:var(--red-bg);color:var(--red);padding:8px 10px;border-radius:6px;font-size:12.5px;margin-top:12px;}

/* ---- Shell ---- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--navy-dark);color:#dfe6f2;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand b{color:#fff;font-size:14.5px;display:block;}
.sidebar .brand span{font-size:11px;color:#9fb0cc;}
.sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
.navgroup-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#7c8db3;padding:14px 18px 6px;}
.navitem{display:flex;align-items:center;gap:9px;padding:9px 18px;color:#cfd9ec;text-decoration:none;font-size:13.3px;
  cursor:pointer;border-left:3px solid transparent;}
.navitem:hover{background:rgba(255,255,255,.06);}
.navitem.active{background:rgba(255,255,255,.10);border-left-color:#6EA8FF;color:#fff;font-weight:600;}
.sidebar .userbox{border-top:1px solid rgba(255,255,255,.08);padding:12px 18px;font-size:12px;color:#b9c5dd;}
.sidebar .userbox b{color:#fff;display:block;font-size:13px;word-break: break-all;}
.sidebar .userbox button{margin-top:8px;background:rgba(255,255,255,.08);border:none;color:#fff;
  padding:6px 10px;border-radius:6px;font-size:11.5px; width: 100%;}
.sidebar .userbox button:hover{background:rgba(255,255,255,.15);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;
  align-items:center;justify-content:space-between;}
.topbar h1{font-size:17px;margin:0;color:var(--navy);}
.topbar .role-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.role-ADMIN{background:var(--red);color:#fff;}
.role-USER{background:var(--blue);color:#fff;}
.content{padding:22px 26px;flex:1;overflow-y:auto;}

/* ---- Cards / stats ---- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-card .n{font-size:24px;font-weight:700;color:var(--navy);}
.stat-card .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.stat-card.attn{border-color:#ecd3ae;background:var(--orange-bg);}
.stat-card.attn .n{color:var(--orange);}

.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.panel h2{font-size:14.5px;margin:0 0 14px;color:var(--navy);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ---- Toolbar / table ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
.toolbar input[type=text],.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;}
.toolbar input[type=text]{min-width:220px;}
.spacer{flex:1;}
.btn{border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text);}
.btn:hover{background:#F4F6F9;}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy-light);}
.btn.danger{color:var(--red);border-color:#f0c7c1;}
.btn.danger:hover{background:var(--red-bg);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

table.data{width:100%;border-collapse:collapse;background:#fff;font-size:13px;}
table.data th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  text-align:left;padding:9px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
table.data td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
table.data tr:hover td{background:#FAFBFD;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff;}
.cell-actions{display:flex;gap:6px;white-space:nowrap;}
.muted{color:var(--muted);}
.small{font-size:11.5px;}

/* ---- badges ---- */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-MASIH_DIGUNAKAN{background:var(--green-bg);color:var(--green);}
.b-ROSAK{background:var(--red-bg);color:var(--red);}
.b-CADANG_LUPUS{background:var(--orange-bg);color:var(--orange);}
.b-DILUPUSKAN{background:var(--grey-bg);color:var(--grey);}
.b-DEFAULT{background:var(--grey-bg);color:var(--grey);}

/* workflow chip row */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
.flow .step{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--grey-bg);color:var(--muted);font-weight:600;}
.flow .step.done{background:var(--green-bg);color:var(--green);}
.flow .step.current{background:var(--navy);color:#fff;}
.flow .arrow{color:var(--border);font-size:12px;}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:36px 16px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 25px 60px rgba(0,0,0,.3);}
.modal.wide{max-width:860px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:15.5px;color:var(--navy);}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.single{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.span2{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:7px;width:100%;}
.field textarea{resize:vertical;min-height:60px;}

/* detail view */
.dl{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:13px;}
.dl dt{color:var(--muted);}
.dl dd{margin:0;font-weight:500;}
.section-title{font-size:12.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;
  margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--border);}
.section-title:first-of-type{border-top:none;margin-top:4px;padding-top:0;}
.empty{color:var(--muted);font-size:12.5px;padding:14px 0;text-align:center;}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

.qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-top: 10px; width: fit-content;}

/* ---- Responsive / mobile ---- */
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--navy);cursor:pointer;padding:2px 6px;line-height:1;}
.sidebar-backdrop{display:none;}
@media(max-width:860px){
  .hamburger{display:inline-block;}
  .shell{position:relative;overflow-x:hidden;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:60;width:250px;max-width:80vw;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.35);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55;}
  .sidebar-backdrop.show{display:block;}
  .main{width:100%;min-width:0;}
  .content{padding:14px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .form-grid{grid-template-columns:1fr!important;}
  .dl{grid-template-columns:1fr!important;gap:2px 0;}
  .dl dt{margin-top:10px;}
  .modal,.modal.wide{max-width:100%;width:100%;border-radius:10px;}
  .overlay{padding:0;align-items:stretch;}
  .overlay .modal{margin:auto 0 0;max-height:92vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;}
  .modal-body{max-height:none;flex:1;overflow-y:auto;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
/* ============================================================
   SISTEM PENGURUSAN ASET ALIH - SEKSYEN BIOKIMIA
   Backend: Supabase
   ============================================================ */

const SUPABASE_URL = "https://lohbpqkldrdagkbhbxka.supabase.co"; // Ganti dengan URL projek anda
const SUPABASE_ANON_KEY = "sb_publishable_o3vJ1G77WzvSkei-hS7dNg_oTJepoIA"; // Ganti dengan kunci "anon public" projek anda

let supabaseClient;
const STATE = {
  user: null,          // session.user
  profile: null,       // user_profiles data
  view: "dashboard",
  loading: true,
  modal: null,
  
  // Data caches
  assets: [],
  locations: [],
  categories: [],
  personnel: [],
  maintenance: [],
  damage: [],
  movements: [],
  inspections: [],
  disposals: [],
  auditLogs: [],
  
  assetFilter: { q:"", status:"", kategori:"", lokasi:"" },
  sidebarOpen: false
};

const STATUS_LIST = ["MASIH DIGUNAKAN","ROSAK","CADANG LUPUS","DILUPUSKAN"];
const DAMAGE_FLOW = ["Dilaporkan","Dalam Semakan","Dalam Pembaikan","Selesai","Ditutup"];
const MOVEMENT_FLOW = ["Permohonan","Dalam Pergerakan","Dipulangkan"];
const DISPOSAL_FLOW = ["Cadangan","Kelulusan","Selesai"];

// --- UTILITIES ---
function toast(msg, kind = "ok"){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerText = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function badgeClass(status){ 
    if(!status) return "badge b-DEFAULT";
    return "badge b-" + status.replace(/\s+/g, '_'); 
}

function fmtDate(d){ 
    if(!d) return "\u2014"; 
    try {
        const date = new Date(d);
        if(isNaN(date.getTime())) return d; // If not a valid date string, return as is
        return date.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' });
    } catch(e) {
        return d;
    }
}

function isAdmin() {
    return STATE.profile && STATE.profile.role === 'ADMIN';
}

function requireAdmin(){
  if(!isAdmin()){
    toast("Akses Ditolak: Memerlukan peranan Admin.", "err");
    return false;
  }
  return true;
}

function assetLabel(a){
  if(!a) return "";
  return (a.no_siri||a.id) + " \u2014 " + (a.nama||"").slice(0,50);
}

function personnelLabel(id){
    if(!id) return "\u2014";
    const p = STATE.personnel.find(x => x.id === id);
    return p ? p.nama : id;
}

function locationLabel(id){
    if(!id) return "\u2014";
    const l = STATE.locations.find(x => x.id === id);
    return l ? l.nama : id;
}

// --- INIT & AUTH ---
async function init(){
  if(!SUPABASE_URL || SUPABASE_URL.includes("MASUKKAN")){
     document.getElementById("app").innerHTML = `<div class="login-wrap"><div class="login-card"><h2>Ralat Konfigurasi</h2><p>Sila masukkan SUPABASE_URL dan SUPABASE_ANON_KEY di dalam kod index.html</p></div></div>`;
     return;
  }
  
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      STATE.user = session.user;
      await fetchProfile(session.user.id);
      await loadAllData();
      STATE.loading = false;
      render();
    } else {
      STATE.user = null;
      STATE.profile = null;
      STATE.loading = false;
      render();
    }
  });
}

async function fetchProfile(userId) {
    const { data, error } = await supabaseClient.from('user_profiles').select('*').eq('id', userId).single();
    if (data) {
        STATE.profile = data;
    } else {
        // Fallback if profile doesn't exist yet
        STATE.profile = { role: 'USER', email: STATE.user.email };
    }
}

async function doLogin(email, password){
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "Mengesahkan...";
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  
  if (error) {
    document.getElementById("loginError").innerHTML = `<div class="login-err">${esc(error.message)}</div>`;
    btn.disabled = false; btn.textContent = "Log Masuk";
  } else {
    toast("Log masuk berjaya");
  }
}

async function doLogout(){
  await supabaseClient.auth.signOut();
  toast("Berjaya log keluar", "info");
}

// --- DATA FETCHING ---
async function loadAllData() {
    try {
        const [assetsRes, locRes, catRes, picRes, maintRes, dmgRes, movRes, inspRes, dispRes] = await Promise.all([
            supabaseClient.from('assets').select('*').eq('is_deleted', false).order('created_at', { ascending: false }),
            supabaseClient.from('locations').select('*').order('nama'),
            supabaseClient.from('categories').select('*').order('nama'),
            supabaseClient.from('personnel').select('*').order('nama'),
            supabaseClient.from('maintenance').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('damage').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('movements').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('inspections').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('disposals').select('*').order('created_at', { ascending: false })
        ]);

        if(assetsRes.data) STATE.assets = assetsRes.data;
        if(locRes.data) STATE.locations = locRes.data;
        if(catRes.data) STATE.categories = catRes.data;
        if(picRes.data) STATE.personnel = picRes.data;
        if(maintRes.data) STATE.maintenance = maintRes.data;
        if(dmgRes.data) STATE.damage = dmgRes.data;
        if(movRes.data) STATE.movements = movRes.data;
        if(inspRes.data) STATE.inspections = inspRes.data;
        if(dispRes.data) STATE.disposals = dispRes.data;

        if (isAdmin()) {
            const { data } = await supabaseClient.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(100);
            if(data) STATE.auditLogs = data;
        }
    } catch (e) {
        toast("Ralat memuat turun data: " + e.message, "err");
        console.error(e);
    }
}

// --- RENDER ENGINE ---
function render(){
  const root = document.getElementById("app");
  if(STATE.loading){
    root.innerHTML = `<div class="login-wrap"><div class="login-card" style="text-align:center;"><h2>Memuatkan...</h2></div></div>`;
    return;
  }
  if(!STATE.user){ root.innerHTML = renderLogin(); bindLoginEvents(); return; }
  
  root.innerHTML = renderShell();
  bindShellEvents();
  
  if (STATE.view === 'dashboard' && STATE.assets.length > 0) {
      renderCharts();
  }
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <h1>Pengurusan Aset Alih</h1>
      <div class="sub">Seksyen Biokimia VRI (Supabase)</div>
      <form id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
          <label>E-mel</label>
          <input type="email" id="loginEmail" placeholder="admin@vri.gov.my" required/>
          <label>Kata Laluan</label>
          <input type="password" id="loginPassword" required/>
          <button type="submit" class="primary" id="loginBtn">Log Masuk</button>
          <div id="loginError"></div>
      </form>
    </div>
  </div>`;
}

function handleLoginSubmit() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    doLogin(email, password);
}

const VIEW_TITLES = {
  dashboard:"Papan Pemuka", assets:"Senarai Aset", maintenance:"Penyelenggaraan",
  damage:"Laporan Kerosakan", movements:"Pergerakan / Pinjaman", inspections:"Pemeriksaan",
  disposals:"Pelupusan", locations:"Tetapan Lokasi", categories:"Tetapan Kategori", personnel:"Tetapan Pemegang (PIC)", audit: "Jejak Audit"
};

function renderShell(){
  const isAdm = isAdmin();
  return `
  <div class="shell">
    <div class="sidebar-backdrop ${STATE.sidebarOpen?'show':''}" id="sidebarBackdrop"></div>
    <div class="sidebar ${STATE.sidebarOpen?'open':''}">
      <div class="brand"><b>Aset Biokimia</b><span>VRI Ipoh</span></div>
      <nav>
        <div class="navgroup-label">Utama</div>
        <div class="navitem ${STATE.view==='dashboard'?'active':''}" data-nav="dashboard">📊 Dashboard</div>
        <div class="navitem ${STATE.view==='assets'?'active':''}" data-nav="assets">📦 Senarai Aset</div>
        
        <div class="navgroup-label">Kitaran Hayat</div>
        <div class="navitem ${STATE.view==='maintenance'?'active':''}" data-nav="maintenance">🔧 Penyelenggaraan</div>
        <div class="navitem ${STATE.view==='damage'?'active':''}" data-nav="damage">⚠️ Kerosakan</div>
        <div class="navitem ${STATE.view==='movements'?'active':''}" data-nav="movements">🔄 Pergerakan</div>
        <div class="navitem ${STATE.view==='inspections'?'active':''}" data-nav="inspections">📋 Pemeriksaan</div>
        <div class="navitem ${STATE.view==='disposals'?'active':''}" data-nav="disposals">🗑️ Pelupusan</div>

        ${isAdm ? `
        <div class="navgroup-label">Tetapan Admin</div>
        <div class="navitem ${STATE.view==='locations'?'active':''}" data-nav="locations">📍 Lokasi</div>
        <div class="navitem ${STATE.view==='categories'?'active':''}" data-nav="categories">🏷️ Kategori</div>
        <div class="navitem ${STATE.view==='personnel'?'active':''}" data-nav="personnel">👥 Pemegang (PIC)</div>
        <div class="navitem ${STATE.view==='audit'?'active':''}" data-nav="audit">🛡️ Jejak Audit</div>
        ` : ''}
      </nav>
      <div class="userbox">
        <b>${esc(STATE.profile? STATE.profile.name : STATE.user.email)}</b>
        <span class="role-badge role-${STATE.profile? STATE.profile.role : 'USER'} mt-1 block w-max">${STATE.profile? STATE.profile.role : 'USER'}</span>
        <button id="logoutBtn" style="background: var(--red); margin-top: 10px;">Log Keluar</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap: 10px;">
            <button class="hamburger" id="hamburgerBtn">&#9776;</button>
            <h1>${VIEW_TITLES[STATE.view]}</h1>
        </div>
        <div class="small muted">🟢 Bersambung ke Supabase</div>
      </div>
      <div class="content" id="contentArea">${renderViewContent()}</div>
    </div>
  </div>
  ${STATE.modal ? renderModal() : ""}
  `;
}

function bindShellEvents(){
  document.getElementById("logoutBtn").onclick = doLogout;

function renderCharts() {

    new Chart(ctx, {

        data: {

            datasets: [{
                data: Object.values(byStatus),
                backgroundColor: ['#1E8E5A', '#C0392B', '#B9770E', '#6B7280'],

// --- ASSETS MODULE ---
function filteredAssets(){
  const f = STATE.assetFilter;
  return STATE.assets.filter(a=>{
    if(f.status && a.status!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (a.no_siri+" "+a.nama+" "+(a.lokasi_id||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

async function saveAsset() {
    if(!requireAdmin()) return;
    const payload = {
        nama: document.getElementById('f_nama').value,
        no_siri: document.getElementById('f_nosiri').value,
        status: document.getElementById('f_status').value,
        kategori_id: document.getElementById('f_kategori').value || null,
        lokasi_id: document.getElementById('f_lokasi').value || null,
        kod_penempatan: document.getElementById('f_kod_penempatan').value,
        pic_id: document.getElementById('f_pic').value || null,
        catatan: document.getElementById('f_catatan').value,
        updated_at: new Date().toISOString()
    };

    try {
        if (STATE.modal.id) {
            const { error } = await supabaseClient.from('assets').update(payload).eq('id', STATE.modal.id);
            if(error) throw error;
            toast("Aset dikemaskini.");
        } else {
            const { error } = await supabaseClient.from('assets').insert([payload]);
            if(error) throw error;
            toast("Aset berjaya didaftarkan.");
        }
        closeModal();
        await loadAllData();
        render();
    } catch(e) {
        toast(e.message, 'err');
    }
}

         fieldsHtml += `
            <div class="field"><label>Jenis Kerosakan</label><input type="text" id="l_type" value="${esc(rec.damage_type)}" required></div>
            <div class="field"><label>Status</label><select id="l_status">${DAMAGE_FLOW.map(s=>`<option value="${s}" ${rec.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
            <div class="field"><label>Tarikh Lapor</label><input type="date" id="l_date" value="${esc(rec.report_date) || todayISO()}"></div>
            <div class="field span2"><label>Penerangan Terperinci</label><textarea id="l_details">${esc(rec.details)}</textarea></div>
        `;
    } else if (table === 'movements') {
         fieldsHtml += `
            <div class="field"><label>Peminjam / Penerima Baru <span class="req">*</span></label><select id="l_pic" required><option value="">-- Pilih --</option>${picOpts}</select></div>
            <div class="field"><label>Lokasi Baru <span class="req">*</span></label><input type="text" id="l_loc" value="${esc(rec.new_location)}" required></div>
            <div class="field"><label>Status</label><select id="l_status">${MOVEMENT_FLOW.map(s=>`<option value="${s}" ${rec.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
            <div class="field span2"><label>Tujuan</label><textarea id="l_purpose">${esc(rec.purpose)}</textarea></div>
        `;
    }

    return `
    <div class="modal wide">
        <div class="modal-head"><h3 class="capitalize">${STATE.modal.id ? 'Kemaskini' : 'Tambah'} Rekod</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body"><form id="lcForm" onsubmit="event.preventDefault(); saveLifecycle();"><div class="form-grid">${fieldsHtml}</div></form></div>
        <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveLifecycle()">Simpan</button></div>
    </div>`;
}

async function saveLifecycle() {
    if(!requireAdmin()) return;
    const table = STATE.modal.table;
    const payload = { asset_id: document.getElementById('l_asset').value };
    
    if(!payload.asset_id) { toast("Sila pilih aset", "err"); return; }

    if (table === 'maintenance') {
        payload.jenis = document.getElementById('l_jenis').value;
        payload.status = document.getElementById('l_status').value;
        payload.start_date = document.getElementById('l_date').value || null;
        payload.cost = document.getElementById('l_cost').value || 0;
        payload.provider = document.getElementById('l_provider').value;
    } else if (table === 'damage') {
        payload.damage_type = document.getElementById('l_type').value;
        payload.status = document.getElementById('l_status').value;
        payload.report_date = document.getElementById('l_date').value || null;
        payload.details = document.getElementById('l_details').value;
    } else if (table === 'movements') {
        payload.borrower_id = document.getElementById('l_pic').value;
        payload.new_location = document.getElementById('l_loc').value;
        payload.status = document.getElementById('l_status').value;
        payload.purpose = document.getElementById('l_purpose').value;
    }

    try {
        if (STATE.modal.id) {
            const { error } = await supabaseClient.from(table).update(payload).eq('id', STATE.modal.id);
            if(error) throw error;
        } else {
            const { error } = await supabaseClient.from(table).insert([payload]);
            if(error) throw error;
        }
        toast("Rekod disimpan.");
        closeModal();
        await loadAllData();
        render();
    } catch(e) { toast(e.message, 'err'); }
}

function openLifecycleDetail(table, id) { STATE.modal = { type: 'lifecycleDetail', table, id }; render(); }
function renderLifecycleDetailModal() {
    const table = STATE.modal.table;
    const rec = STATE[table].find(x => x.id === STATE.modal.id);
    const asset = STATE.assets.find(a => a.id === rec.asset_id);
    
    let html = `<div class="small muted mb-4">Aset Terlibat: <b>${assetLabel(asset)}</b></div><dl class="dl">`;
    
    if (table === 'maintenance') {
        html += `<dt>Jenis</dt><dd>${esc(rec.jenis)}</dd><dt>Status</dt><dd>${esc(rec.status)}</dd><dt>Tarikh Mula</dt><dd>${fmtDate(rec.start_date)}</dd><dt>Kos</dt><dd>RM ${rec.cost}</dd><dt>Penyedia</dt><dd>${esc(rec.provider)}</dd>`;
    } else if (table === 'damage') {
        html += `<dt>Jenis Kerosakan</dt><dd>${esc(rec.damage_type)}</dd><dt>Status Semasa</dt><dd>${esc(rec.status)}</dd><dt>Tarikh Lapor</dt><dd>${fmtDate(rec.report_date)}</dd><dt>Penerangan</dt><dd>${esc(rec.details)}</dd>`;
    } else if (table === 'movements') {
         html += `<dt>Peminjam</dt><dd>${esc(personnelLabel(rec.borrower_id))}</dd><dt>Lokasi Baru</dt><dd>${esc(rec.new_location)}</dd><dt>Status</dt><dd>${esc(rec.status)}</dd><dt>Tujuan</dt><dd>${esc(rec.purpose)}</dd>`;
    }

    html += `</dl>`;

    return `
    <div class="modal">
        <div class="modal-head"><h3 class="capitalize">Butiran Rekod</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">${html}</div>
        <div class="modal-foot">
            ${isAdmin() ? `<button class="btn" onclick="openLifecycleForm('${table}', '${rec.id}')">Edit Rekod</button>` : ''}
            <button class="btn primary" onclick="closeModal()">Tutup</button>
        </div>
    </div>`;
}

function todayISO(){ return new Date().toISOString().slice(0,10); }

function renderModal(){
  if(!STATE.modal) return "";
  let inner = "";
  if(STATE.modal.type==="assetProfile") inner = renderAssetProfileModal();
  else if(STATE.modal.type==="assetForm") inner = renderAssetFormModal();
  else if(STATE.modal.type==="setupForm") inner = renderSetupFormModal();
  else if(STATE.modal.type==="lifecycleForm") inner = renderLifecycleFormModal();
  else if(STATE.modal.type==="lifecycleDetail") inner = renderLifecycleDetailModal();
  
  // Setup QR code after render if needed
  setTimeout(() => {
     if(STATE.modal && STATE.modal.type === "assetProfile") {
         const canvas = document.getElementById('qrCodeCanvas');
         if(canvas) {
             const qrText = `${window.location.origin}${window.location.pathname}?asset_id=${STATE.modal.id}`;
             new QRious({ element: canvas, value: qrText, size: 120, level: 'H' });
         }
     }
  }, 0);

  return `<div class="overlay" id="modalOverlay">${inner}</div>`;
}

function bindModalEvents(){
  const overlay = document.getElementById("modalOverlay");
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==="modalOverlay") closeModal(); };
}

// Start App
init();
</script>
</body>
</html>
