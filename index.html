<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sistem Pengurusan Aset Alih - Seksyen Biokimia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Custom Theme Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#14294A', 800: '#1F3864', 700: '#2E5090' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #toastWrap { position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden flex flex-col">

    <div id="app" class="h-full w-full flex">
        <!-- Tetingkap Memuatkan Penuh -->
        <div class="w-full h-full flex items-center justify-center bg-navy-900 text-white">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mx-auto mb-4"></div>
                <p>Memuatkan Sistem Aset...</p>
            </div>
        </div>
    </div>
    <div id="toastWrap"></div>

<script>
/* ============================================================
   FRONTEND SPA - MENGGUNAKAN SUPABASE
   ============================================================ */

// >>> LANGKAH 1: MASUKKAN URL & KUNCI ANON SUPABASE ANDA DI SINI <<<
const SUPABASE_URL = "https://lohbpqkldrdagkbhbxka.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_o3vJ1G77WzvSkei-hS7dNg_oTJepoIA";

let supabaseClient;

// Semak jika kunci belum dimasukkan
if(SUPABASE_URL.includes("MASUKKAN-PROJECT-REF")){
    document.getElementById('app').innerHTML = `
        <div class="w-full h-full flex items-center justify-center bg-gray-100 p-8">
            <div class="bg-white p-8 rounded shadow text-center max-w-lg">
                <h1 class="text-xl font-bold text-red-600 mb-2">Supabase Belum Dikonfigurasi</h1>
                <p class="text-sm text-gray-600">Sila buka fail <code>index.html</code> dan kemaskini pembolehubah <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di baris ke-45.</p>
            </div>
        </div>
    `;
    throw new Error("Konfigurasi Supabase tiada.");
} else {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const STATE = {
    user: null,
    profile: null,
    view: 'dashboard',
    assets: [],
    auditLogs: []
};

// ==========================================
// UTILITI PENGURUSAN MESEJ (TOAST)
// ==========================================
function toast(msg, type = "success") {
    const wrap = document.getElementById("toastWrap");
    const el = document.createElement("div");
    el.className = `${type === "success" ? "bg-emerald-600" : "bg-red-600"} text-white px-4 py-3 rounded shadow-lg text-sm fade-in`;
    el.innerText = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.remove(); }, 4000);
}

function esc(str) {
    if (!str) return "";
    return str.toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ==========================================
// PENGURUSAN PENGESAHAN (AUTH) SUPABASE
// ==========================================
supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (session) {
        STATE.user = session.user;
        await fetchUserProfile(session.user.id);
        renderApp();
    } else {
        STATE.user = null;
        STATE.profile = null;
        renderApp();
    }
});

async function fetchUserProfile(userId) {
    const { data, error } = await supabaseClient.from('user_profiles').select('*').eq('id', userId).single();
    if (!error && data) {
        STATE.profile = data;
    } else {
        // Jika profil tiada, set sebagai USER biasa secara lalai
        STATE.profile = { role: 'USER', name: STATE.user.email };
    }
}

async function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    btn.innerText = "Mengesahkan..."; btn.disabled = true;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    
    if (error) {
        document.getElementById('loginError').innerText = "E-mel atau kata laluan tidak sah.";
        btn.innerText = "Log Masuk"; btn.disabled = false;
    } else {
        toast("Log masuk berjaya");
    }
}

async function doLogout() {
    await supabaseClient.auth.signOut();
    toast("Telah log keluar", "info");
}

// ==========================================
// PEMAPARAN ANTARAMUKA (UI)
// ==========================================
function renderApp() {
    const root = document.getElementById('app');
    if (!STATE.user || !STATE.profile) {
        root.innerHTML = renderLogin();
        document.getElementById('loginForm').addEventListener('submit', doLogin);
        return;
    }
    
    root.innerHTML = `
        <!-- Sidebar -->
        <div class="w-64 bg-navy-900 text-white flex flex-col hidden md:flex">
            <div class="p-5 border-b border-navy-700">
                <h1 class="font-bold text-lg leading-tight">Aset Alih Biokimia</h1>
                <p class="text-xs text-blue-300 mt-1">VRI Ipoh &middot; SPA Supabase</p>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2">
                <button onclick="navigate('dashboard')" class="w-full text-left px-3 py-2 rounded text-sm hover:bg-navy-800 ${STATE.view==='dashboard'?'bg-navy-700 font-bold':''}">📊 Dashboard</button>
                <button onclick="navigate('assets')" class="w-full text-left px-3 py-2 rounded text-sm mt-2 hover:bg-navy-800 ${STATE.view==='assets'?'bg-navy-700 font-bold':''}">📦 Senarai Aset</button>
                
                ${STATE.profile.role === 'ADMIN' ? `
                <div class="mt-6 mb-2 ml-3 text-xs font-semibold text-gray-400 uppercase tracking-wider">Pentadbir Sahaja</div>
                <button onclick="navigate('audit')" class="w-full text-left px-3 py-2 rounded text-sm hover:bg-navy-800 ${STATE.view==='audit'?'bg-navy-700 font-bold':''}">🛡️ Jejak Audit (System Log)</button>
                ` : ''}
            </nav>
            <div class="p-4 bg-navy-800 text-sm">
                <div class="font-bold truncate">${esc(STATE.profile.name || STATE.user.email)}</div>
                <span class="inline-block mt-1 px-2 py-1 bg-blue-600 text-xs rounded-full font-semibold">${STATE.profile.role}</span>
                <button onclick="doLogout()" class="mt-3 w-full bg-red-600 hover:bg-red-700 text-white py-1.5 rounded text-xs transition font-semibold">Log Keluar</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 bg-gray-50 overflow-hidden">
            <header class="bg-white border-b px-6 py-4 flex items-center justify-between">
                <h2 class="text-xl font-bold text-navy-800 capitalize">${STATE.view}</h2>
                <div class="text-xs text-gray-500 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Pangkalan Data Terhubung
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-6" id="mainContent">
                <div class="flex justify-center items-center h-full"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-navy-800"></div></div>
            </main>
        </div>
        <div id="modalContainer" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"></div>
    `;

    loadViewData();
}

function renderLogin() {
    return `
    <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-navy-900 to-navy-700">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md fade-in">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-navy-800">Pengurusan Aset Alih</h1>
                <p class="text-sm text-gray-500 mt-1">Seksyen Biokimia VRI (Pangkalan Data Supabase)</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">E-mel Berdaftar</label>
                    <input type="email" id="loginEmail" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-navy-800 outline-none" required placeholder="admin@vri.gov.my">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Kata Laluan</label>
                    <input type="password" id="loginPassword" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-navy-800 outline-none" required>
                </div>
                <div id="loginError" class="text-red-500 text-sm text-center font-semibold"></div>
                <button type="submit" id="loginBtn" class="w-full bg-navy-800 hover:bg-navy-700 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-lg">Log Masuk</button>
            </form>
        </div>
    </div>`;
}

function navigate(view) {
    STATE.view = view;
    renderApp();
}

// ==========================================
// PENGAMBILAN DATA (SUPABASE QUERIES)
// ==========================================
async function loadViewData() {
    const main = document.getElementById('mainContent');
    try {
        if (STATE.view === 'dashboard' || STATE.view === 'assets') {
            // Ambil data aset menggunakan RLS (Hanya yang is_deleted=false)
            const { data, error } = await supabaseClient.from('assets').select('*').eq('is_deleted', false).order('created_at', { ascending: false });
            if (error) throw error;
            STATE.assets = data;
            
            if (STATE.view === 'dashboard') main.innerHTML = renderDashboardView();
            else main.innerHTML = renderAssetsView();
            
        } else if (STATE.view === 'audit' && STATE.profile.role === 'ADMIN') {
            // Ambil jejak audit (Hanya Admin dibenarkan oleh RLS Pangkalan Data)
            const { data, error } = await supabaseClient.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(100);
            if (error) throw error;
            STATE.auditLogs = data;
            main.innerHTML = renderAuditView();
        }
    } catch (err) {
        main.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg font-semibold">Ralat Pangkalan Data: ${err.message}</div>`;
    }
}

// ==========================================
// RENDER MUKA SURAT
// ==========================================
function renderDashboardView() {
    const total = STATE.assets.length;
    const active = STATE.assets.filter(a => a.status === 'MASIH DIGUNAKAN').length;
    const broken = STATE.assets.filter(a => a.status === 'ROSAK').length;
    
    return `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 border-l-4 border-l-navy-800">
                <div class="text-sm font-bold text-gray-500 uppercase tracking-wide">Jumlah Keseluruhan Aset</div>
                <div class="text-4xl font-bold text-navy-800 mt-2">${total}</div>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 border-l-4 border-l-emerald-500">
                <div class="text-sm font-bold text-gray-500 uppercase tracking-wide">Aktif Digunakan</div>
                <div class="text-4xl font-bold text-emerald-600 mt-2">${active}</div>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 border-l-4 border-l-red-500">
                <div class="text-sm font-bold text-gray-500 uppercase tracking-wide">Aset Rosak</div>
                <div class="text-4xl font-bold text-red-600 mt-2">${broken}</div>
            </div>
        </div>
        
        <div class="bg-blue-50 border border-blue-200 text-blue-800 p-5 rounded-xl text-sm leading-relaxed">
            <p class="font-bold text-lg mb-1">Status Seni Bina Web</p>
            <p>Sistem ini sedang beroperasi menggunakan persekitaran <strong>"Serverless"</strong>. Pangkalan data <strong>PostgreSQL</strong> dikendalikan oleh Supabase. Keselamatan dikuatkuasakan di peringkat jadual melalui <em>Row Level Security (RLS)</em>. Sebarang modifikasi data oleh pengguna tanpa status ADMIN akan disekat oleh pangkalan data secara automatik.</p>
        </div>
    `;
}

function renderAssetsView() {
    return `
        <div class="flex justify-between items-center mb-6">
            <input type="text" id="searchAsset" placeholder="Cari nama, no. siri, lokasi..." onkeyup="filterAssets()" class="px-4 py-2 border border-gray-300 rounded-lg w-full md:w-1/3 outline-none focus:ring-2 focus:ring-navy-800 shadow-sm text-sm">
            ${STATE.profile.role === 'ADMIN' ? `<button onclick="openAssetModal()" class="bg-navy-800 hover:bg-navy-700 text-white px-4 py-2 rounded-lg font-semibold shadow transition text-sm whitespace-nowrap ml-4">➕ Daftar Aset</button>` : ''}
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs border-b">
                    <tr>
                        <th class="p-4 font-bold">No. Siri</th>
                        <th class="p-4 font-bold">Nama Aset</th>
                        <th class="p-4 font-bold">Kategori</th>
                        <th class="p-4 font-bold">Lokasi</th>
                        <th class="p-4 font-bold">Status</th>
                        <th class="p-4 font-bold text-center">Tindakan</th>
                    </tr>
                </thead>
                <tbody id="assetTableBody" class="divide-y divide-gray-100">
                    ${generateAssetRows(STATE.assets)}
                </tbody>
            </table>
        </div>
    `;
}

function generateAssetRows(assets) {
    if(assets.length === 0) return `<tr><td colspan="6" class="p-8 text-center text-gray-500">Tiada aset direkodkan.</td></tr>`;
    return assets.map(a => `
        <tr class="hover:bg-gray-50 transition-colors">
            <td class="p-4 font-mono text-xs text-gray-600">${esc(a.no_siri) || '-'}</td>
            <td class="p-4 font-medium text-gray-800">${esc(a.nama)}</td>
            <td class="p-4 text-gray-600 text-xs">${esc(a.kategori)}</td>
            <td class="p-4 text-gray-600 text-xs">${esc(a.lokasi)}</td>
            <td class="p-4">
                <span class="px-2 py-1 text-[10px] uppercase font-bold rounded-full border 
                    ${a.status === 'MASIH DIGUNAKAN' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 
                      a.status === 'ROSAK' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-gray-100 text-gray-700 border-gray-300'}">
                    ${esc(a.status)}
                </span>
            </td>
            <td class="p-4 text-center space-x-3">
                <button onclick="viewAssetDetails('${a.id}')" class="text-navy-700 hover:text-navy-900 font-bold text-xs uppercase underline">Profil</button>
                ${STATE.profile.role === 'ADMIN' ? `<button onclick="openAssetModal('${a.id}')" class="text-orange-600 hover:text-orange-800 font-bold text-xs uppercase underline">Edit</button>` : ''}
            </td>
        </tr>
    `).join('');
}

function filterAssets() {
    const q = document.getElementById('searchAsset').value.toLowerCase();
    const filtered = STATE.assets.filter(a => 
        (a.nama && a.nama.toLowerCase().includes(q)) || 
        (a.no_siri && a.no_siri.toLowerCase().includes(q)) ||
        (a.lokasi && a.lokasi.toLowerCase().includes(q))
    );
    document.getElementById('assetTableBody').innerHTML = generateAssetRows(filtered);
}

function renderAuditView() {
    return `
        <div class="bg-yellow-50 border border-yellow-200 p-5 rounded-xl mb-6">
            <p class="text-sm text-yellow-800 font-bold mb-1">Kawasan Log Pangkalan Data Keselamatan Tinggi (Immutable Audit Trail)</p>
            <p class="text-xs text-yellow-700">Setiap rekod dalam senarai ini dihasilkan secara mandiri oleh <strong>PostgreSQL Trigger</strong> di dalam pelayan Supabase. Pengguna, mahupun pembangun antaramuka ini, tidak mempunyai kebenaran pangkalan data (melalui RLS) untuk memadam atau mengubah mana-mana rekod sejarah di bawah.</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
             <table class="w-full text-sm text-left">
                    <thead class="bg-navy-900 text-white uppercase text-[10px] tracking-wider">
                        <tr><th class="p-3">Tarikh & Masa</th><th class="p-3">Pelaku</th><th class="p-3">Tindakan</th><th class="p-3">Jadual Terjejas</th></tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        ${STATE.auditLogs.map(a => `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 whitespace-nowrap text-xs font-mono text-gray-500">${new Date(a.created_at).toLocaleString('ms-MY')}</td>
                                <td class="p-3 font-medium text-navy-800 text-xs">${esc(a.user_email)}</td>
                                <td class="p-3">
                                    <span class="px-2 py-1 bg-gray-200 rounded text-[10px] font-bold ${a.action.includes('DELETE')?'bg-red-100 text-red-800':a.action==='CREATE'?'bg-emerald-100 text-emerald-800':'bg-blue-100 text-blue-800'}">${esc(a.action)}</span>
                                </td>
                                <td class="p-3 text-xs uppercase tracking-wide text-gray-500 font-mono">${esc(a.table_name)}<br><span class="text-[9px] text-gray-400">ID: ${a.record_id}</span></td>
                            </tr>
                        `).join('')}
                        ${STATE.auditLogs.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-gray-500">Tiada log setakat ini.</td></tr>` : ''}
                    </tbody>
                </table>
        </div>
    `;
}

// ==========================================
// MODAL & CRUD ASET KEPADA SUPABASE
// ==========================================
function closeModals() {
    const mc = document.getElementById('modalContainer');
    mc.innerHTML = '';
    mc.classList.add('hidden');
}

function viewAssetDetails(id) {
    const a = STATE.assets.find(x => x.id === id);
    if (!a) return;

    const modalHTML = `
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden fade-in">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-navy-50">
                <h3 class="font-bold text-lg text-navy-800">Profil Aset</h3>
                <button onclick="closeModals()" class="text-gray-500 hover:text-red-500 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 flex flex-col md:flex-row gap-6">
                <div class="flex-1 space-y-4 text-sm">
                    <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Nama Aset</span><span class="font-semibold text-gray-900">${esc(a.nama)}</span></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><span class="text-gray-400 block text-[10px] uppercase font-bold">No. Siri</span><span class="font-mono text-gray-800 text-xs">${esc(a.no_siri) || '-'}</span></div>
                        <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Status Semasa</span><span class="font-bold text-navy-800">${esc(a.status)}</span></div>
                        <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Kategori</span><span class="text-gray-800">${esc(a.kategori) || '-'}</span></div>
                        <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Lokasi</span><span class="text-gray-800">${esc(a.lokasi) || '-'}</span></div>
                    </div>
                    <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Catatan</span><span class="text-gray-600 bg-gray-50 p-2 block rounded border">${esc(a.catatan) || 'Tiada catatan'}</span></div>
                </div>
                <div class="w-48 flex flex-col items-center justify-center bg-gray-50 border border-gray-200 rounded-xl p-4 shadow-inner">
                    <canvas id="qrCodeCanvas" class="mb-3"></canvas>
                    <span class="text-[10px] uppercase tracking-wider text-center text-gray-500 font-bold">Imbas untuk Profil</span>
                </div>
            </div>
            <div class="px-6 py-3 bg-gray-50 border-t flex justify-end">
                <button onclick="closeModals()" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-800 px-5 py-2 rounded-lg font-semibold text-sm transition shadow-sm">Tutup Profil</button>
            </div>
        </div>
    `;
    
    const mc = document.getElementById('modalContainer');
    mc.innerHTML = modalHTML;
    mc.classList.remove('hidden');

    const qrText = `${window.location.origin}/profil-aset.html?id=${a.id}`;
    new QRious({ element: document.getElementById('qrCodeCanvas'), value: qrText, size: 150, level: 'H' });
}

function openAssetModal(id = null) {
    const a = id ? STATE.assets.find(x => x.id === id) : {};
    
    const modalHTML = `
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden fade-in">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-navy-50">
                <h3 class="font-bold text-lg text-navy-800">${id ? 'Kemaskini Maklumat Aset' : 'Daftar Aset Baharu'}</h3>
                <button onclick="closeModals()" class="text-gray-500 hover:text-red-500 text-2xl leading-none">&times;</button>
            </div>
            <form id="assetDataForm" class="p-6 space-y-4 text-sm bg-gray-50/50">
                <div class="grid grid-cols-2 gap-5">
                    <div class="col-span-2">
                        <label class="block font-bold text-gray-700 mb-1 text-xs uppercase tracking-wide">Nama Aset <span class="text-red-500">*</span></label>
                        <input type="text" id="f_nama" value="${esc(a.nama)}" required class="w-full border-gray-300 border rounded-lg p-2.5 focus:ring-2 focus:ring-navy-800 outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1 text-xs uppercase tracking-wide">No Siri Pendaftaran</label>
                        <input type="text" id="f_noSiri" value="${esc(a.no_siri)}" class="w-full border-gray-300 border rounded-lg p-2.5 focus:ring-2 focus:ring-navy-800 outline-none shadow-sm font-mono text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1 text-xs uppercase tracking-wide">Status Aset <span class="text-red-500">*</span></label>
                        <select id="f_status" class="w-full border-gray-300 border rounded-lg p-2.5 focus:ring-2 focus:ring-navy-800 outline-none shadow-sm">
                            <option value="MASIH DIGUNAKAN" ${a.status==='MASIH DIGUNAKAN'?'selected':''}>MASIH DIGUNAKAN</option>
                            <option value="ROSAK" ${a.status==='ROSAK'?'selected':''}>ROSAK</option>
                            <option value="CADANG LUPUS" ${a.status==='CADANG LUPUS'?'selected':''}>CADANG LUPUS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1 text-xs uppercase tracking-wide">Kategori</label>
                        <input type="text" id="f_kategori" value="${esc(a.kategori)}" class="w-full border-gray-300 border rounded-lg p-2.5 focus:ring-2 focus:ring-navy-800 outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1 text-xs uppercase tracking-wide">Lokasi</label>
                        <input type="text" id="f_lokasi" value="${esc(a.lokasi)}" class="w-full border-gray-300 border rounded-lg p-2.5 focus:ring-2 focus:ring-navy-800 outline-none shadow-sm">
                    </div>
                    <div class="col-span-2">
                        <label class="block font-bold text-gray-700 mb-1 text-xs uppercase tracking-wide">Catatan Tambahan</label>
                        <textarea id="f_catatan" rows="3" class="w-full border-gray-300 border rounded-lg p-2.5 focus:ring-2 focus:ring-navy-800 outline-none shadow-sm">${esc(a.catatan)}</textarea>
                    </div>
                </div>
                <div class="pt-5 border-t flex justify-end gap-3 mt-6">
                    ${id ? `<button type="button" onclick="deleteAsset('${id}')" class="bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 px-5 py-2 rounded-lg font-bold transition mr-auto shadow-sm">Padam/Lupus</button>` : ''}
                    <button type="button" onclick="closeModals()" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-800 px-5 py-2 rounded-lg font-bold transition shadow-sm">Batal</button>
                    <button type="submit" id="btnSimpan" class="bg-navy-800 hover:bg-navy-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition">Simpan Rekod DB</button>
                </div>
            </form>
        </div>
    `;
    
    const mc = document.getElementById('modalContainer');
    mc.innerHTML = modalHTML;
    mc.classList.remove('hidden');

    document.getElementById('assetDataForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true; btn.innerText = "Menyimpan...";

        const payload = {
            nama: document.getElementById('f_nama').value,
            no_siri: document.getElementById('f_noSiri').value,
            status: document.getElementById('f_status').value,
            kategori: document.getElementById('f_kategori').value,
            lokasi: document.getElementById('f_lokasi').value,
            catatan: document.getElementById('f_catatan').value,
            updated_at: new Date().toISOString()
        };

        try {
            if (id) {
                const { error } = await supabaseClient.from('assets').update(payload).eq('id', id);
                if (error) throw error;
                toast("Aset berjaya dikemaskini dalam pangkalan data.");
            } else {
                const { error } = await supabaseClient.from('assets').insert([payload]);
                if (error) throw error;
                toast("Aset baharu berjaya dicipta secara kekal.");
            }
            closeModals();
            loadViewData(); // Muat turun senarai terbaru dari DB
        } catch(err) {
            toast(err.message, 'error');
            btn.disabled = false; btn.innerText = "Simpan Rekod DB";
        }
    };
}

async function deleteAsset(id) {
    if(!confirm("Anda pasti mahu memadam aset ini? Sistem akan menukar statusnya kepada DILUPUSKAN (Soft Delete) demi integriti sejarah audit pangkalan data.")) return;
    try {
        const { error } = await supabaseClient.from('assets').update({ is_deleted: true, status: 'DILUPUSKAN', updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        toast("Aset berjaya dipadam secara logikal.");
        closeModals();
        loadViewData();
    } catch(err) {
        toast(err.message, 'error');
    }
}

// Buka terus pautan Supabase pada mulanya
renderApp();
</script>
</body>
</html>
